<rect x="54" y="890" width="110" height="34" rx="6" fill="#b8433a"/><text x="109" y="912" font-size="13" font-weight="700" fill="#f4ead2" text-anchor="middle">방 나가기</text>
<rect x="176" y="890" width="96" height="34" rx="6" fill="#5a4636"/><text x="224" y="912" font-size="12" fill="#f4ead2" text-anchor="middle">봇 추가 +</text>
<text x="284" y="912" font-size="11" fill="#a39a85">(테스트 빌드만)</text>
<text x="1190" y="912" font-size="12" fill="#cfc6b0" text-anchor="end">6 대 5 · 관전 2 · 방장이 시작할 수 있어요</text>
<rect x="1206" y="886" width="140" height="40" rx="6" fill="#E2B23C"/><text x="1276" y="912" font-size="14" font-weight="700" fill="#2b2a24" text-anchor="middle">게임 시작 ›››</text>
<text x="38" y="962" font-size="12" fill="#cfc6b0">빈 자리를 누르면 내가 그 자리로 옮겨 간다. 옮기기 · 양도 · 강퇴 · 게임 시작은 방장 화면에만 나오고, 다른 사람 화면에는 빈 자리 누르기와 방 나가기만 있다.</text>
<text x="38" y="982" font-size="12" fill="#cfc6b0">들어오는 길: 방 번호를 받아 로비의 ‘# 코드로 참가’로. 파티장이 방을 만들거나 들어가면 파티원은 따라 들어온다(같은 팀에 먼저 앉고, 각자 옮길 수 있다).</text>

<!-- flow and stages -->
<rect x="22" y="1016" width="1356" height="246" rx="8" fill="#1f232d"/>
<text x="38" y="1044" font-size="15" font-weight="700" fill="#f4ead2">흐름</text>
<text x="38" y="1070" font-size="12.5" fill="#E2B23C" font-weight="700">랜덤 매칭</text>
<text x="118" y="1070" font-size="12.5" fill="#cfc6b0">로비(파티 구성) → 랜덤 매칭 → 로비에서 시간만 센다 → ‘상대를 찾았습니다’ → 대결 장면 · 코스 공개 → 경기 → 결과 → 로비</text>
<text x="38" y="1094" font-size="12.5" fill="#E2B23C" font-weight="700">방 생성</text>
<text x="118" y="1094" font-size="12.5" fill="#cfc6b0">로비(파티 구성) → 방 생성 또는 코드로 참가 → 방 화면(팀 조율 · 관전석) → 방장이 게임 시작 → 대결 장면 · 코스 공개 → 경기(관전자는 관전) → 결과 → 로비</text>
<text x="38" y="1134" font-size="15" font-weight="700" fill="#f4ead2">만드는 순서 — 단계마다 보여 드리고 검수받는다</text>
<text x="38" y="1162" font-size="12.5" fill="#E2B23C" font-weight="700">1단계</text>
<text x="88" y="1162" font-size="12.5" fill="#cfc6b0">로비 버튼 정리(랜덤 매칭 · 방 생성), 랜덤 매칭 중에는 로비에 머물고 시간만 센다. 방장 · 강퇴 · 양도는 랜덤 매칭에서 없어진다.</text>
<text x="38" y="1186" font-size="12.5" fill="#E2B23C" font-weight="700">2단계</text>
<text x="88" y="1186" font-size="12.5" fill="#cfc6b0">방 화면: 방 번호 · 자리 옮기기 · 방장의 옮기기 / 양도 / 강퇴 / 게임 시작 · 12명이 차도 자동 시작 없음.</text>
<text x="38" y="1210" font-size="12.5" fill="#E2B23C" font-weight="700">3단계</text>
<text x="88" y="1210" font-size="12.5" fill="#cfc6b0">관전석과 경기 관전: 관전 카메라(보는 사람 바꾸기), 관전자에게 경기 화면 보내기, 결과 화면. 가장 큰 작업이라 마지막.</text>
<text x="38" y="1242" font-size="11.5" fill="#a39a85">3단계 전까지는 관전석에 사람이 앉아 있으면 게임 시작이 꺼진다(자리를 조율하는 대기석으로만 쓴다).</text>
<text x="1362" y="1252" font-size="11" fill="#6f6a5d" text-anchor="end">R692 제안 · R693 방 화면 배치 수정(관전석을 아래로) · 2026-11-17</text>
</svg>

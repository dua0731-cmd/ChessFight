<text x="22" y="58" font-size="13" fill="#a39a85">리그 오브 레전드식: 파티를 먼저 꾸리고, 랜덤 매칭은 로비에서 시간만 세고, 방 생성은 방 화면에서 팀을 조율한 뒤 방장이 시작한다. (예상 화면 — 실제 그림체는 지금 로비 · 입장 화면 그대로)</text>


<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>폰 러시 · 중반 미니게임 3D</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 'Malgun Gothic','Apple SD Gothic Neo',sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}main{max-width:1400px;margin:auto;padding:26px 26px 40px}.head{display:flex;align-items:start;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--muted)}h1{font-family:Georgia,'Batang',serif;font-size:clamp(27px,3.6vw,40px);line-height:1.2;margin:8px 0 10px}p{margin:0}.sub{color:var(--muted);max-width:80ch}.stage-links{display:flex;gap:6px;flex-shrink:0;padding:4px;border:1px solid var(--line);border-radius:9px}.stage-links a{font-size:13px;text-decoration:none;padding:5px 13px;border-radius:5px;color:var(--muted)}.stage-links a[aria-current]{background:var(--active);color:var(--on)}.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:24px 0 15px}.games.late{grid-template-columns:repeat(3,minmax(0,1fr))}.games button{display:flex;gap:12px;text-align:left;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:11px 14px;box-shadow:var(--shadow)}.games button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.game-letter{font:700 24px Georgia,serif;color:var(--accent)}.game-title{font-size:14px;font-weight:700;display:block}.game-desc{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:12px 18px;justify-content:space-between;flex-wrap:wrap;align-items:center;margin-bottom:12px}.controls{display:flex;flex-wrap:wrap;gap:6px}.control,select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--panel);color:var(--ink);font-size:12px}.control[aria-pressed=true]{background:var(--active);color:var(--on)}.approach{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.viewport{height:min(68vh,690px);min-height:450px;position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#b6c0ca;box-shadow:var(--shadow)}canvas{display:block;width:100%;height:100%;touch-action:none}#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.tag{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;line-height:1.3;font-weight:700;background:#f6f3e9ed;color:#26313b;padding:4px 7px;border:1px solid #d7d4ca;border-radius:4px;transform:translate(-9999px,0);box-shadow:0 1px 4px #0002}.tag.team{background:#1e344de8;border-color:#1e344d;color:#e9f3ff}.tag.bound{background:#4d56a4e8;border-color:#4d56a4;color:#fff}.tag.obstacle{background:#a75e30ed;border-color:#a75e30;color:#fff}.view-title{position:absolute;left:16px;top:14px;color:#26313b;background:#fbf8efed;padding:9px 12px;border-radius:6px;max-width:75%;font-size:12px}.view-title strong{display:block;font-size:15px}.hint{position:absolute;bottom:12px;right:14px;color:#e8edf4;background:#213044db;padding:5px 10px;border-radius:5px;font-size:11px}#error{position:absolute;inset:0;display:grid;place-content:center;padding:30px;text-align:center;background:#e9e6dd;color:#26313b}#error[hidden]{display:none}.timeline{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:15px 0}.primary{background:var(--active);color:var(--on);min-width:150px}.progress{display:grid;flex:1;min-width:200px;gap:4px}.progress label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin-top:8px}.fact{padding:14px 17px;border-right:1px solid var(--line)}.fact:last-child{border:0}.fact span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.fact p{font-size:13px}.caption{font-size:11px;color:var(--muted);margin:16px 0 0}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}.note{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:760px){main{padding:18px 12px 30px}.head{display:block}.stage-links{display:inline-flex;margin-top:14px}.games,.games.late{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px}.games button{padding:9px;gap:8px}.game-title{font-size:12px}.game-desc{font-size:10px}.toolbar{gap:10px}.viewport{min-height:420px;height:59vh}.view-title{max-width:85%;font-size:10px}.view-title strong{font-size:12px}.facts{grid-template-columns:repeat(2,1fr)}.fact{border-bottom:1px solid var(--line)}.fact:nth-child(2){border-right:0}.fact:nth-last-child(-n+2){border-bottom:0}.timeline{gap:10px}.timeline select{max-width:155px}.tag{font-size:10px}.hint{font-size:10px}}

.games.early{grid-template-columns:repeat(3,minmax(0,1fr))}.modeling{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 15px;font-size:12px;color:var(--muted)}.modeling summary{cursor:pointer;color:var(--ink);font-weight:700}.modeling div{padding-top:10px;max-width:110ch}@media(max-width:760px){.games.early{grid-template-columns:repeat(2,minmax(0,1fr))}}

<script>

(() => {

    B:{title:'보수 중인 동관',rule:'판자 다리',read:'뜯긴 마루 아래의 낭떠러지와 판자 더미',action:'판자 10장을 2열 × 5줄로 깔아 팀 문까지 잇기',size:'스테이션 안 10 m 낭떠러지 · 2.5 × 2 m 판자',watch:'가운데 통로는 남기고, 스테이션 바닥만 끊음',props:'톱질 받침 · 공구 상자 · 먼지막이 천'},

    G:{title:'왕의 행차 회랑',rule:'킹 호위',read:'보라 테두리의 15칸 길과 가마·근위 룩',action:'킹 가마와 막은 룩 자체를 밀고 끌어 옆문으로 모시기',size:'15칸 · 느린 담비털 칸 4개 · 막은 룩 2개',watch:'작은 잡기 블록·밧줄 없음 · 장식 담비털 없음',props:'벨벳 줄 기둥 · 나팔 거치대 · 접은 깃발'},
    H:{title:'국왕 체스 홀',rule:'체크메이트 몰이',read:'큰 체스판과 도망치는 킹, 체크 때 떨어지는 빛',action:'킹 6개를 몰아 굳힌 뒤 잡아 기물 상자에 모으기',size:'8 × 8 판 · 기둥 c6·f3·f7',watch:'체스판과 그 둘레 1 m에는 보라 러너를 깔지 않음',props:'큰 체스 시계 · 기물 상자 · 기보 석판'},

  const keys = early ? ['C','D','A'] : late ? ['G','H','I'] : ['E','B','F','J'];
  const places = early ? ['1-1 왕실 수로 정원','1-2 왕실 마차뜰','1-3 깃발 연무뜰','1-4 나이트 마구간','1-5 룩 성벽길'] : late ? ['3-1 국왕 작전실','3-2 왕실 금고실','3-3 국왕 집무실','3-4 왕의 옷방','3-5 왕실 천문대'] : ['2-1 대계단 현관홀','2-2 왕실 초상화 회랑','2-3 근위대 무구실','2-4 대연회장','2-5 왕궁 주방'];

  const root=document.getElementById('preview');
  root.innerHTML=`<header class="head"><div><div class="eyebrow">PAWN RUSH / ${early?'SLOT 02 · PALACE FORECOURT':late?'SLOT 06 · UPPER PALACE':'SLOT 04 · LOWER PALACE'}</div><h1>${early?'왕궁의 첫 문을 열다':late?'왕의 방으로 들어가기 전에':'아랫궁에서 다음 길을 열다'}</h1><p class="sub">${early?'크림 석재 성문 앞에서, 해자를 건너고 쇠살문을 올리고 의장 체스판을 완성하는 세 장면.':late?'보라 러너와 높은 대리석 홀 안에서, 왕을 모시고 잡고 지키는 세 장면.':'같은 홀 안에서 판자를 놓고, 책장을 오르고, 스텝을 읽고, 수조를 건너는 네 장면.'}</p></div><nav class="stage-links" aria-label="구역"><a href="PAWN_RUSH_EARLY_PLAZA_3D.html" ${early?'aria-current="page"':''}>초반 3종</a><a href="PAWN_RUSH_MID_MINIGAMES_3D.html" ${!early&&!late?'aria-current="page"':''}>중반 4종</a><a href="PAWN_RUSH_LATE_MINIGAMES_3D.html" ${late?'aria-current="page"':''}>후반 3종</a></nav></header>
  <div class="games ${stage}" role="group" aria-label="미니게임">${keys.map(k=>`<button data-game="${k}" aria-pressed="${k===state.game}"><span class="game-letter">${k}</span><span><span class="game-title">${DATA[k].title}</span><span class="game-desc">${DATA[k].rule}</span></span></button>`).join('')}</div>

  <div class="viewport" id="viewport"><canvas id="canvas" aria-label="미니게임 프리팹 공간을 돌려 보는 3D 장면">미니게임의 입구, 팀 스테이션 두 곳, 팀 문, 뒤 회랑을 보여 줍니다.</canvas><div id="labels" aria-hidden="true"></div><div class="view-title"><strong id="sceneTitle"></strong><span id="sceneDetail"></span></div><div class="hint" id="hint">드래그로 회전 · 휠로 확대 · 우클릭으로 이동</div><div id="error" hidden>3D를 불러오지 못했습니다.<br>인터넷 연결과 브라우저의 WebGL 사용 여부를 확인해 주세요.</div></div>

  <div class="facts"><div class="fact"><span>처음 읽히는 것</span><p id="read"></p></div><div class="fact"><span>하는 일</span><p id="action"></p></div><div class="fact"><span>치수·규칙 기준</span><p id="size"></p></div><div class="fact"><span>이번에 확인할 것</span><p id="watch"></p></div></div>
  <div class="legend"><span><i class="dot" style="background:#d18b52"></i>앞 장애물 프리팹</span><span><i class="dot" style="background:#6b80c7"></i>미니게임 프리팹</span><span><i class="dot" style="background:#f0bd3c"></i>할 일 · 잡거나 밟을 곳</span><span>문은 팀별로 열리고, 가운데 정문은 닫힌 상태</span></div>

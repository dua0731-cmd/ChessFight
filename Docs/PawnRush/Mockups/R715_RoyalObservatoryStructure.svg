  <text x="518" y="292">④ 심장 원대</text><text x="518" y="336">⑤ 대망원경</text><text x="518" y="380">⑥ 슬릿 발코니</text>
</g>
<g font-size="12" fill="#d8cfba">
  <text x="660" y="160">직선 위의 둥근 판 둘 (26 m)</text><text x="660" y="204">넓은 초승달 호 150° (79 m)</text><text x="660" y="248">솟아오르는 반 바퀴 (50 m)</text>
  <text x="660" y="292">기둥 위 둥근 단 (지름 16 m)</text><text x="660" y="336">곧은 오르막 다리 (26 m)</text><text x="660" y="380">벽의 호 발코니와 출구 길</text>
  <text x="900" y="160">자오선과 아스트롤라베</text><text x="900" y="204">가장 바깥 행성의 궤도</text><text x="900" y="248">혼천의의 황도 고리</text>
  <text x="900" y="292">혼천의의 심장, 태양</text><text x="900" y="336">슬릿을 겨눈 경통</text><text x="900" y="380">돔이 열리는 곳</text>
  <text x="1076" y="160">0 m</text><text x="1076" y="204">0 m</text><text x="1076" y="248">0 → 6 m</text><text x="1076" y="292">6 m</text><text x="1076" y="336">6 → 14 m</text><text x="1076" y="380">14 m</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 730" width="100%" style="height:auto;max-width:1180px" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">

<rect x="500" y="76" width="660" height="330" rx="8" fill="#1f232d"/>
<text x="518" y="102" font-size="15" font-weight="700" fill="#f4ead2">여섯 가지 모양 — 같은 모양이 두 번 나오지 않는다</text>
<g font-size="12" fill="#a39a85"><text x="518" y="126">구간</text><text x="660" y="126">모양</text><text x="900" y="126">천문대의 무엇</text><text x="1076" y="126">높이</text></g>

<text x="24" y="56" font-size="13" fill="#a39a85">위에서 본 배치 · 북쪽이 위 · 중심 (0, 70) · 흰 점선 = 진행 경로 · 장애물은 아직 놓지 않았다(구조 먼저)</text>


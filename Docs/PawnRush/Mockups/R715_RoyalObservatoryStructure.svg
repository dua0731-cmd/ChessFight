<rect x="500" y="418" width="660" height="200" rx="8" fill="#1f232d"/>
<text x="518" y="444" font-size="15" font-weight="700" fill="#f4ead2">경로를 따라 본 높이 — 고리의 기울기와 망원경이 오르막이다</text>
<g stroke="#2b303c"><line x1="548" y1="590" x2="1136" y2="590"/><line x1="548" y1="542" x2="1136" y2="542"/><line x1="548" y1="478" x2="1136" y2="478"/></g>
<g font-size="11" fill="#a39a85" text-anchor="end"><text x="542" y="594">0 m</text><text x="542" y="546">6 m</text><text x="542" y="482">14 m</text></g>
<path d="M548,590 L843,590 C873,590 933,542 963,542 L1008,542 L1071,478 L1136,478" fill="none" stroke="#f4ead2" stroke-width="3"/>
<g font-size="12" font-weight="700" fill="#f4ead2" text-anchor="middle">
  <text x="600" y="580">①</text><text x="736" y="580">②</text><text x="903" y="556">③</text><text x="986" y="532">④</text><text x="1034" y="500">⑤</text><text x="1104" y="468">⑥</text>
</g>
<g font-size="11" fill="#a39a85"><text x="548" y="608">0 m</text><text x="1136" y="608" text-anchor="end">약 240 m</text></g>

<rect x="500" y="630" width="660" height="80" rx="8" fill="#1f232d"/>
<text x="518" y="656" font-size="12.5" fill="#d8cfba">입구에 서면 자오선 정면 위로 심장의 태양 구와 대망원경, 그 끝의 출구가 한 줄로 보인다.</text>
<text x="518" y="678" font-size="12.5" fill="#d8cfba">대망원경은 지나온 두 궤도 위를 다리처럼 건넌다. 기울어진 궤도는 높은 쪽이 6 m라 건너뛸 수 없다.</text>
<text x="518" y="700" font-size="12.5" fill="#a39a85">구조안이다. 회색 상자(R712)는 아직 v0.1 배치 그대로 — 상세: PAWN_RUSH_ROYAL_OBSERVATORY_STRUCTURE_v0.2.md</text>

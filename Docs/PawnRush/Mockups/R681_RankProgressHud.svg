<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1830" width="100%" style="height:auto;max-width:1280px" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <title>R681 순위 · 진행도 HUD 예상 화면 (6 대 6 피드백 6 · 7번)</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eadfc8"/>
      <stop offset="1" stop-color="#cbb894"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9dcf3"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3a07a"/>
      <stop offset="1" stop-color="#d9caa7"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>

    <!-- a pawn seen from behind: feet at 0,0 -->
    <g id="pawnW">
      <ellipse cx="0" cy="2" rx="40" ry="9" fill="#000" fill-opacity=".25"/>
      <ellipse cx="0" cy="-6" rx="34" ry="10" fill="#d9cbac"/>
      <path d="M-30,-8 C-26,-50 -14,-70 -12,-84 L12,-84 C14,-70 26,-50 30,-8 Z" fill="#efe4cc"/>
      <ellipse cx="0" cy="-86" rx="18" ry="6" fill="#d9cbac"/>
      <circle cx="0" cy="-106" r="20" fill="#f3ead6"/>
    </g>
    <g id="pawnB">
      <ellipse cx="0" cy="2" rx="40" ry="9" fill="#000" fill-opacity=".25"/>
      <ellipse cx="0" cy="-6" rx="34" ry="10" fill="#45454c"/>
      <path d="M-30,-8 C-26,-50 -14,-70 -12,-84 L12,-84 C14,-70 26,-50 30,-8 Z" fill="#5c5c65"/>
      <ellipse cx="0" cy="-86" rx="18" ry="6" fill="#45454c"/>
      <circle cx="0" cy="-106" r="20" fill="#66666f"/>
    </g>

    <!-- an example game view (the grand stair hall): only a stand-in for the real picture -->
    <g id="scene">
      <rect width="1280" height="420" fill="url(#wall)"/>
      <g fill="url(#pane)" stroke="#a8946c" stroke-width="5">
        <rect x="105" y="80" width="96" height="240" rx="48"/>
        <rect x="355" y="80" width="96" height="240" rx="48"/>
        <rect x="829" y="80" width="96" height="240" rx="48"/>
        <rect x="1079" y="80" width="96" height="240" rx="48"/>
      </g>
      <rect x="0" y="352" width="1280" height="68" fill="#9c8358"/>
      <rect x="0" y="346" width="1280" height="10" fill="#7d6742"/>
      <polygon points="0,420 1280,420 1280,720 0,720" fill="url(#floor)"/>
      <g stroke="#fff" stroke-opacity=".2" stroke-width="2">
        <line x1="640" y1="330" x2="-400" y2="720"/><line x1="640" y1="330" x2="0" y2="720"/>
        <line x1="640" y1="330" x2="1280" y2="720"/><line x1="640" y1="330" x2="1680" y2="720"/>
        <line x1="0" y1="446" x2="1280" y2="446"/><line x1="0" y1="482" x2="1280" y2="482"/>
        <line x1="0" y1="534" x2="1280" y2="534"/><line x1="0" y1="610" x2="1280" y2="610"/>
      </g>
      <polygon points="575,420 705,420 900,720 380,720" fill="#9c3a3a"/>
      <g stroke="#d9b25a" stroke-width="4" stroke-opacity=".8">
        <line x1="575" y1="420" x2="380" y2="720"/><line x1="705" y1="420" x2="900" y2="720"/>
      </g>
      <!-- a rolling statue coming down, a hammer swinging -->
      <rect x="532" y="400" width="84" height="26" rx="13" fill="#a9a396" stroke="#7f7a70" stroke-width="3"/>
      <line x1="1150" y1="0" x2="1088" y2="300" stroke="#4a4a52" stroke-width="7"/>
      <circle cx="1082" cy="322" r="42" fill="#55565e"/>
      <circle cx="1068" cy="308" r="12" fill="#7d7e88"/>
      <!-- a teammate and an opponent ahead, their name tags (as in the game now) -->
      <use href="#pawnW" transform="translate(468,506) scale(.55)"/>
      <rect x="436" y="412" width="64" height="20" rx="4" fill="#3fc1d9"/>
      <text x="468" y="427" font-size="12" font-weight="700" fill="#06202a" text-anchor="middle">♟ 폰폰</text>
      <use href="#pawnB" transform="translate(806,478) scale(.5)"/>
      <rect x="771" y="392" width="70" height="20" rx="4" fill="#f08a2c"/>
      <text x="806" y="407" font-size="12" font-weight="700" fill="#2a1503" text-anchor="middle">♟ 룩앤롤</text>
      <!-- this player's pawn -->
      <use href="#pawnW" transform="translate(640,566) scale(1.2)"/>
      <rect width="1280" height="720" fill="url(#vig)"/>
    </g>

    <!-- the HUD the match has now (unchanged): stamina, skill card, chat -->
    <g id="hud0">
      <rect x="503" y="644" width="34" height="34" rx="6" fill="#0e121c" fill-opacity=".86"/>
      <text x="520" y="669" font-size="22" fill="#f4ead2" text-anchor="middle">♟</text>
      <rect x="545" y="654" width="232" height="14" rx="3" fill="#0e121c" fill-opacity=".86"/>
      <rect x="547" y="656" width="164" height="10" rx="2" fill="#6fcf5a"/>
      <rect x="936" y="544" width="320" height="56" fill="#0d121f" fill-opacity=".82"/>
      <rect x="936" y="544" width="320" height="4" fill="#e9dcc0"/>
      <rect x="946" y="554" width="38" height="38" fill="#e9dcc0"/>
      <text x="965" y="581" font-size="22" font-weight="700" fill="#0d121f" text-anchor="middle">F</text>
      <text x="996" y="571" font-size="15" font-weight="700" fill="#f4ead2">폰 · 밀치기 걸음</text>
      <text x="996" y="590" font-size="12" fill="#bfae8e">F 사용 · 승격 발판에 서서 승격</text>
      <rect x="20" y="628" width="300" height="50" rx="4" fill="#000" fill-opacity=".28"/>
      <text x="30" y="648" font-size="13" fill="#9fe3f0">[팀] 폰폰: 석상 온다 오른쪽으로!</text>
      <text x="30" y="668" font-size="13" fill="#f4ead2">[전체] 룩앤롤: ㅋㅋㅋ</text>
    </g>

    <!-- NEW: the strip at the top middle - rank, course progress, crown platform count -->
    <g id="strip">
      <rect x="236" y="6" width="808" height="56" rx="7" fill="#0e121c" fill-opacity=".88" stroke="#d9b25a" stroke-opacity=".6"/>
      <!-- rank -->
      <rect x="244" y="13" width="80" height="42" rx="5" fill="#3fc1d9" fill-opacity=".16" stroke="#3fc1d9" stroke-opacity=".75"/>
      <text x="254" y="44" font-size="28" font-weight="700" fill="#f4ead2">6</text>
      <text x="272" y="43" font-size="15" font-weight="700" fill="#f4ead2">위</text>
      <text x="292" y="43" font-size="11" fill="#bfae8e">/ 12</text>
      <!-- the two lanes: white team above, black team below -->
      <text x="339" y="28" font-size="9" font-weight="700" fill="#3fc1d9" text-anchor="end">백</text>
      <text x="339" y="41" font-size="9" font-weight="700" fill="#f08a2c" text-anchor="end">흑</text>
      <g fill="#f4ead2" fill-opacity=".22">
        <rect x="344" y="20" width="114.4" height="8" rx="2"/><rect x="344" y="33" width="114.4" height="8" rx="2"/>
        <rect x="529.3" y="20" width="114.4" height="8" rx="2"/><rect x="529.3" y="33" width="114.4" height="8" rx="2"/>
        <rect x="714.6" y="20" width="40" height="8" rx="2"/><rect x="714.6" y="33" width="40" height="8" rx="2"/>
        <rect x="825.5" y="20" width="74.4" height="8" rx="2"/><rect x="825.5" y="33" width="74.4" height="8" rx="2"/>
      </g>
      <!-- mini-game segments: brass frames, filled by each team's own progress -->
      <g fill="#d9b25a" fill-opacity=".2" stroke="#d9b25a" stroke-opacity=".75" stroke-width="1">
        <rect x="462.4" y="20" width="62.9" height="8" rx="2"/><rect x="462.4" y="33" width="62.9" height="8" rx="2"/>
        <rect x="647.7" y="20" width="62.9" height="8" rx="2"/><rect x="647.7" y="33" width="62.9" height="8" rx="2"/>
        <rect x="758.6" y="20" width="62.9" height="8" rx="2"/><rect x="758.6" y="33" width="62.9" height="8" rx="2"/>
      </g>
      <rect x="462.4" y="20" width="62.9" height="8" rx="2" fill="#3fc1d9" fill-opacity=".6"/>
      <rect x="462.4" y="33" width="62.9" height="8" rx="2" fill="#f08a2c" fill-opacity=".6"/>
      <rect x="647.7" y="20" width="12.6" height="8" rx="2" fill="#3fc1d9" fill-opacity=".75"/>
      <rect x="647.7" y="33" width="28.3" height="8" rx="2" fill="#f08a2c" fill-opacity=".75"/>
      <g font-size="8.5" fill="#bfae8e" text-anchor="middle">
        <text x="401.2" y="55">정원</text><text x="493.9" y="55" fill="#d9b25a">미니게임</text><text x="586.5" y="55">대계단</text>
        <text x="679.2" y="55" fill="#d9b25a">미니게임</text><text x="734.6" y="55">임시</text><text x="790.1" y="55" fill="#d9b25a">미니게임</text>
        <text x="862.7" y="55">엔딩</text>
      </g>
      <!-- one dot a player: white team on the upper lane, black team on the lower -->
      <g fill="#3fc1d9" stroke="#0e121c" stroke-width="1">
        <circle cx="543" cy="24" r="4"/><circle cx="563.6" cy="24" r="4"/><circle cx="580.8" cy="24" r="4"/>
        <circle cx="618.5" cy="24" r="4"/><circle cx="660.3" cy="24" r="4"/>
      </g>
      <g fill="#f08a2c" stroke="#0e121c" stroke-width="1">
        <circle cx="538.5" cy="37" r="4"/><circle cx="572.8" cy="37" r="4"/><circle cx="586.5" cy="37" r="4"/>
        <circle cx="609.4" cy="37" r="4"/><circle cx="673.5" cy="37" r="4"/><circle cx="678.5" cy="37" r="4"/>
      </g>
      <!-- me: larger, a brass ring, a marker over it -->
      <circle cx="600.2" cy="24" r="6" fill="#3fc1d9" stroke="#f1cf7a" stroke-width="2.2"/>
      <polygon points="600.2,16.5 595.8,9.5 604.6,9.5" fill="#f1cf7a"/>
      <!-- the finish and the crown platform's count -->
      <text x="913" y="37" font-size="17" fill="#f1cf7a" text-anchor="middle">♛</text>
      <text x="930" y="28" font-size="11" font-weight="700" fill="#3fc1d9">백 0 / 4</text>
      <text x="930" y="42" font-size="11" font-weight="700" fill="#f08a2c">흑 0 / 4</text>
      <text x="1008" y="36" font-size="8.5" fill="#bfae8e" text-anchor="middle">왕관 발판</text>
    </g>

    <!-- NEW (B only): the live ranking list -->
    <g id="list">
      <rect x="1062" y="6" width="206" height="170" rx="7" fill="#0e121c" fill-opacity=".88" stroke="#d9b25a" stroke-opacity=".6"/>
      <text x="1074" y="25" font-size="11" font-weight="700" fill="#d9b25a">실시간 순위</text>
      <rect x="1066" y="143" width="198" height="24" rx="4" fill="#f1cf7a" fill-opacity=".2" stroke="#f1cf7a" stroke-opacity=".7"/>
      <g font-size="13" fill="#f4ead2">
        <text x="1076" y="48" font-weight="700">1</text><circle cx="1098" cy="44" r="4.5" fill="#f08a2c"/><text x="1110" y="48">룩앤롤</text>
        <text x="1076" y="71" font-weight="700">2</text><circle cx="1098" cy="67" r="4.5" fill="#f08a2c"/><text x="1110" y="71">체크메이트</text>
        <text x="1076" y="94" font-weight="700">3</text><circle cx="1098" cy="90" r="4.5" fill="#3fc1d9"/><text x="1110" y="94">나이트킹</text>
        <text x="1076" y="117" font-weight="700">4</text><circle cx="1098" cy="113" r="4.5" fill="#3fc1d9"/><text x="1110" y="117">폰폰</text>
        <text x="1076" y="140" font-weight="700">5</text><circle cx="1098" cy="136" r="4.5" fill="#f08a2c"/><text x="1110" y="140">비숍비숍</text>
        <text x="1076" y="160" font-weight="700" fill="#f1cf7a">6</text><circle cx="1098" cy="156" r="4.5" fill="#3fc1d9"/><text x="1110" y="160" font-weight="700" fill="#f1cf7a">나</text>
      </g>
    </g>

    <!-- numbered notes -->
    <g id="notes" font-size="12" font-weight="700" text-anchor="middle">
      <g stroke="#f1cf7a" stroke-width="1.5">
        <line x1="284" y1="56" x2="284" y2="80"/><line x1="420" y1="44" x2="420" y2="80"/>
        <line x1="679" y1="59" x2="679" y2="80"/><line x1="975" y1="48" x2="975" y2="80"/>
      </g>
      <g fill="#f1cf7a">
        <circle cx="284" cy="90" r="11"/><circle cx="420" cy="90" r="11"/><circle cx="679" cy="90" r="11"/><circle cx="975" cy="90" r="11"/>
      </g>
      <g fill="#0e121c">
        <text x="284" y="94.5">1</text><text x="420" y="94.5">2</text><text x="679" y="94.5">3</text><text x="975" y="94.5">4</text>
      </g>
    </g>
  </defs>

  <rect width="1280" height="1830" fill="#171a22"/>

  <!-- A -->
  <text x="20" y="25" font-size="17" font-weight="700" fill="#f4ead2">A안 (기본) — 위쪽 가운데 띠 하나: 내 순위 · 코스 진행도 · 왕관 발판 인원</text>
  <g transform="translate(0,38)">
    <use href="#scene"/><use href="#hud0"/><use href="#strip"/><use href="#notes"/>
  </g>

  <!-- B -->
  <text x="20" y="787" font-size="17" font-weight="700" fill="#f4ead2">B안 — A안 + 오른쪽 위 실시간 순위 목록(상위 5명과 나)</text>
  <g transform="translate(0,800)">
    <use href="#scene"/><use href="#hud0"/><use href="#strip"/><use href="#notes"/><use href="#list"/>
    <line x1="1062" y1="110" x2="1046" y2="110" stroke="#f1cf7a" stroke-width="1.5"/>
    <circle cx="1035" cy="110" r="11" fill="#f1cf7a"/>
    <text x="1035" y="114.5" font-size="12" font-weight="700" fill="#0e121c" text-anchor="middle">5</text>
  </g>

  <!-- the strip enlarged -->
  <text x="20" y="1551" font-size="15" font-weight="700" fill="#f4ead2">위쪽 띠를 1.5배로 확대</text>
  <g transform="translate(-320,1556) scale(1.5)">
    <use href="#strip"/>
  </g>

  <!-- what each part is -->
  <g font-size="14" fill="#e8dfc8">
    <text x="20" y="1680"><tspan font-weight="700" fill="#f1cf7a">1 내 순위</tspan>  지금 전체 12명 중 몇 위인지. 바탕색은 내 팀 색.</text>
    <text x="20" y="1704"><tspan font-weight="700" fill="#f1cf7a">2 코스 진행도</tspan>  한 판의 7구간을 한 줄로. 윗줄은 백팀(청록), 아랫줄은 흑팀(주황), 점 하나가 한 명. 내 점은 크게, 금색 테두리와 ▼ 표시.</text>
    <text x="20" y="1728"><tspan font-weight="700" fill="#f1cf7a">3 미니게임 칸</tspan>  금색 테두리 칸. 거리 대신 그 팀의 미니게임 진척도만큼 채워지고, 깨면 가득 찬다(지나온 두 번째 칸처럼).</text>
    <text x="20" y="1752"><tspan font-weight="700" fill="#f1cf7a">4 왕관 발판 인원</tspan>  지금 화면 맨 위의 긴 글상자("왕관 발판 백 0/4 · 흑 0/4 …")를 이 자리로 줄여 옮긴다.</text>
    <text x="20" y="1776"><tspan font-weight="700" fill="#f1cf7a">5 실시간 순위 목록 (B안만)</tspan>  상위 5명과 나. 팀 색 점 + 닉네임, 내 줄은 금색.</text>
    <text x="20" y="1808" font-size="12.5" fill="#a39a85">배경과 폰은 설명용 그림이다. 스태미나 바 · 스킬 카드 · 채팅 · 이름표는 지금 HUD 그대로이고, 새로 만드는 것은 1 ~ 5뿐이다. 닉네임은 예시.</text>
  </g>
</svg>

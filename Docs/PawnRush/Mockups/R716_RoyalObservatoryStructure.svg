<text x="518" y="656" font-size="12.5" fill="#d8cfba">실제 하늘과 같다: 북두칠성의 끝 두 별을 이으면 북극성(천구)에 닿고, 그 반대편에 W자 카시오페이아가 있다.</text>
<text x="518" y="678" font-size="12.5" fill="#d8cfba">돔 천장의 별자리표에 같은 자리로 두 별자리가 그려져 있다 — 천장이 코스의 지도다.</text>
<text x="518" y="700" font-size="12.5" fill="#a39a85">구조안이다. 회색 상자(R712)는 아직 v0.1 배치 그대로 — 상세: PAWN_RUSH_ROYAL_OBSERVATORY_STRUCTURE_v0.3.md</text>

<text x="595.73" y="621.73" font-size="10" fill="#f4ead2" text-anchor="middle">높이 -8 ~ 1.5 m</text>
<text x="595.73" y="636.73" font-size="10" fill="#e9dfc4" text-anchor="middle">첫 사람 28초</text>
<rect x="658.43" y="468.32" width="94.61" height="77.41" fill="#3f8f6b" stroke="#5c5649" stroke-width="1" fill-opacity="0.9"/>
<text x="705.73" y="561.73" font-size="11" fill="#f4ead2" text-anchor="middle" font-weight="700">미니게임 방</text>

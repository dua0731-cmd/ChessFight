<rect x="24" y="641.73" width="1232" height="144" fill="#1f232d" rx="8"/>
<text x="38" y="663.73" font-size="13" fill="#f4ead2" text-anchor="start" font-weight="700">숫자 출처</text>
<text x="38" y="685.73" font-size="11.5" fill="#f4ead2" text-anchor="start">바닥 크기 · 길 길이 · 높이는 코드(빌더 상수와 진행 경로 ProgressPath 점의 합)에서 읽음. 시간: 정원 · 대계단 홀 · 미니게임 · 작전 회의실은 11-15 6대6 빌드 시험 CSV</text>
<text x="38" y="702.73" font-size="11.5" fill="#f4ead2" text-anchor="start">실측(한 사람 기준, 넘어짐 포함), 마차뜰은 R660 봇 측정(구역별), 금고실은 시안 계산(선두 · 중앙값).</text>
<text x="38" y="719.73" font-size="11.5" fill="#e5dcc5" text-anchor="start">· 한 판(7슬롯 + 복도 6개) 진행 경로 약 830 ~ 900 m, 11-15 공개 경기 2판은 승리까지 11분 31초 · 11분 35초. 한 사람의 슬롯별 중앙값은 88 + 93 + 142 +</text>
<text x="38" y="736.73" font-size="11.5" fill="#f4ead2" text-anchor="start">95 + 5 + 58 + 14초.</text>
<text x="38" y="753.73" font-size="11.5" fill="#e5dcc5" text-anchor="start">· 금고실 자리(슬롯 5 후반 장애물)는 지금 12 × 24 m 임시 바닥(5초). 다른 장애물 구간 규모(길 210 ~ 303 m, 높이 +4.5 ~ +16 m, 한 사람 1분 15초 ~ 4분)에</text>
<text x="38" y="770.73" font-size="11.5" fill="#f4ead2" text-anchor="start">맞추면 한 판이 약 2분 늘어남.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 795" width="100%" style="height:auto;max-width:1280px" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<title>폰 러시 맵 규모 비교 — 최신 main(R687) 기준, 같은 축척</title>

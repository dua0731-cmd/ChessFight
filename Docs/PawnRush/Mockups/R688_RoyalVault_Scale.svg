<rect width="1280" height="795" fill="#171a22"/>
<text x="24" y="34" font-size="20" fill="#f4ead2" text-anchor="start" font-weight="700">폰 러시 맵 규모 비교 — 최신 main(R687) 기준, 같은 축척</text>
<text x="24" y="58" font-size="13" fill="#a39a85" text-anchor="start">장애물 구간 3개 · 임시 바닥 · 작전 회의실 · 미니게임 방 · 복도, 그리고 왕실 금고실 시안 A · B · C(금색 테두리)</text>
<text x="24" y="78" font-size="12" fill="#a39a85" text-anchor="start">같은 축척(1 m = 2.15 px). 사각형 = 걸을 수 있는 바닥의 바깥 테두리(장식 제외). 아래 숫자: 폭 × 길이 · 길 길이 · 오르는 높이 · 시간</text>
<rect x="33.76" y="258.68" width="150.51" height="287.04" fill="#a99d80" stroke="#5c5649" stroke-width="1" fill-opacity="0.9"/>
<text x="109.01" y="561.73" font-size="11" fill="#f4ead2" text-anchor="middle" font-weight="700">왕실 수로 정원</text>
<text x="109.01" y="576.73" font-size="9.5" fill="#a39a85" text-anchor="middle">장애물 구간 · 슬롯 1</text>
<text x="109.01" y="591.73" font-size="10" fill="#f4ead2" text-anchor="middle">70 × 133.5 m</text>
<text x="109.01" y="606.73" font-size="10" fill="#f4ead2" text-anchor="middle">길 259 m</text>
<text x="109.01" y="621.73" font-size="10" fill="#f4ead2" text-anchor="middle">높이 0 → 4.5 m</text>
<text x="109.01" y="636.73" font-size="10" fill="#e9dfc4" text-anchor="middle">실측 73 ~ 146초</text>

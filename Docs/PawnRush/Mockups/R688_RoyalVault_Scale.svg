<text x="925.73" y="621.73" font-size="10" fill="#f4ead2" text-anchor="middle">높이 0 → 12 m</text>
<text x="925.73" y="636.73" font-size="10" fill="#e9dfc4" text-anchor="middle">선두 약 1:20 (계산)</text>
<rect x="1020.04" y="382.32" width="31.39" height="163.41" fill="#d9b25a" stroke="#f4ead2" stroke-width="2" fill-opacity="0.9"/>

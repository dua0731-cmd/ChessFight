<svg xmlns="http://www.w3.org/2000/svg" width="680" height="924" viewBox="0 0 680 924" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <pattern id="checker" x="100" y="80" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#eee8dc"/>
      <rect width="40" height="40" fill="#dfd8ca"/>
      <rect x="40" y="40" width="40" height="40" fill="#dfd8ca"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2622"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <style>
      text { fill: #2a2622; font-size: 11px; }
      .halo { paint-order: stroke; stroke: #faf8f3; stroke-width: 3px; stroke-linejoin: round; }
      .bold { font-weight: 700; }
      .dim { stroke: #6b645a; stroke-width: 1; }
    </style>
  </defs>

  <rect width="680" height="924" fill="#faf8f3"/>

  <text x="40" y="32" class="bold" style="font-size:18px">국왕 알현실 결전장 · 배치도 v0.1</text>
  <text x="40" y="52" style="font-size:12px">폰 러시 엔딩 구간(6번 슬롯) · 2026-11-21 · 회색 상자(JY-audience-hall)의 숫자</text>
  <text x="100" y="72">위에서 본 모습 — 바닥 한 칸 2 m</text>

  <!-- Plan: X = 100 + (x + 12) * 20, Y = 80 + (22 - z) * 20 -->
  <rect x="100" y="80" width="480" height="440" fill="url(#checker)"/>
  <rect x="100" y="80" width="480" height="60" fill="#2a2622" fill-opacity="0.06"/>

  <!-- Dais: four 0.75 m treads and the top, lighter = higher (0.25 / 0.5 / 0.75 / 1.0 / 1.25 m) -->
  <rect x="200" y="140" width="280" height="220" fill="#cbc2b1" stroke="#8f8676"/>
  <rect x="215" y="140" width="250" height="205" fill="#d4ccbd" stroke="#8f8676"/>
  <rect x="230" y="140" width="220" height="190" fill="#ddd6c9" stroke="#8f8676"/>
  <rect x="245" y="140" width="190" height="175" fill="#e6e0d5" stroke="#8f8676"/>
  <rect x="260" y="140" width="160" height="160" fill="#f3efe8" stroke="#8f8676"/>

  <!-- Front corners: plinths (sheer, 1.25 m) with statues -->
  <rect x="200" y="300" width="60" height="60" fill="#bdb4a3" stroke="#6d665b" stroke-width="1.5"/>
  <rect x="420" y="300" width="60" height="60" fill="#bdb4a3" stroke="#6d665b" stroke-width="1.5"/>
  <circle cx="230" cy="328" r="15.6" fill="none" stroke="#2a2622" stroke-width="1"/>
  <circle cx="230" cy="328" r="12" fill="#ffffff" stroke="#2a2622" stroke-width="1.5"/>
  <circle cx="450" cy="328" r="15.6" fill="none" stroke="#2a2622" stroke-width="1"/>
  <circle cx="450" cy="328" r="12" fill="#222222" stroke="#000000" stroke-width="1.5"/>

  <!-- Red carpet: main door to the throne -->
  <rect x="310" y="168" width="60" height="352" fill="#a8232b" fill-opacity="0.72"/>

  <!-- Throne platform (the finish): 6 m circle, centre z 15 -->
  <circle cx="340" cy="220" r="60" fill="#e9b824" fill-opacity="0.33" stroke="#b07f08" stroke-width="3"/>

  <!-- Throne across the circle's north edge -->
  <rect x="320" y="144" width="40" height="24" rx="3" fill="#6f5210" stroke="#3d2c06" stroke-width="1.5"/>
  <text x="340" y="160" text-anchor="middle" style="fill:#ffffff;font-size:10px">왕좌</text>

  <!-- The dais's back is a 1.25 m cliff -->
  <line x1="200" y1="140" x2="480" y2="140" stroke="#2a2622" stroke-width="5"/>

  <!-- Columns, 1.2 m, at x +-10.5 -->
  <g fill="#d6cfc1" stroke="#6d665b" stroke-width="2">
    <circle cx="130" cy="460" r="12"/><circle cx="130" cy="360" r="12"/><circle cx="130" cy="260" r="12"/><circle cx="130" cy="160" r="12"/>
    <circle cx="550" cy="460" r="12"/><circle cx="550" cy="360" r="12"/><circle cx="550" cy="260" r="12"/><circle cx="550" cy="160" r="12"/>
  </g>

  <!-- Where the throne contest stands the teams (x -9 / +9) -->
  <g fill="#ffffff" stroke="#2a2622" stroke-width="2">
    <circle cx="160" cy="160" r="7"/><circle cx="160" cy="184" r="7"/><circle cx="160" cy="208" r="7"/>
    <circle cx="160" cy="232" r="7"/><circle cx="160" cy="256" r="7"/><circle cx="160" cy="280" r="7"/>
  </g>
  <g fill="#222222" stroke="#000000" stroke-width="2">
    <circle cx="520" cy="160" r="7"/><circle cx="520" cy="184" r="7"/><circle cx="520" cy="208" r="7"/>
    <circle cx="520" cy="232" r="7"/><circle cx="520" cy="256" r="7"/><circle cx="520" cy="280" r="7"/>
  </g>

  <!-- Team banners on the side walls -->
  <rect x="97" y="190" width="7" height="60" fill="#ffffff" stroke="#2a2622" stroke-width="1.5"/>
  <rect x="576" y="190" width="7" height="60" fill="#222222" stroke="#000000" stroke-width="1.5"/>

  <!-- Walls, the main door open in the south wall -->
  <path d="M220 520 H100 V80 H580 V520 H460" fill="none" stroke="#2a2622" stroke-width="6"/>

  <!-- Ways onto the dais -->
  <line x1="170" y1="220" x2="197" y2="220" stroke="#2a2622" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="510" y1="220" x2="483" y2="220" stroke="#2a2622" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="340" y1="505" x2="340" y2="372" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arw)"/>

  <!-- Plan labels -->
  <text x="340" y="114" text-anchor="middle">왕좌 뒤 통로 3 m · 단상 뒷면은 잡고 오를 수 있는 1.25 m 절벽</text>
  <text x="340" y="212" text-anchor="middle" class="halo bold">왕좌 발판 · 지름 6 m</text>
  <text x="340" y="228" text-anchor="middle" class="halo" style="font-size:10px">팀 과반이 서 있는 동안 시간이 쌓인다</text>
  <text x="340" y="294" text-anchor="middle" class="halo" style="font-size:10px">단상 윗면 8 × 8 m · 높이 1.25 m</text>
  <text x="287" y="354" text-anchor="middle" class="halo" style="font-size:9.5px">남쪽 큰 계단</text>
  <text transform="translate(232 222) rotate(-90)" text-anchor="middle" class="halo bold" style="font-size:10px">백팀 쪽 계단</text>
  <text transform="translate(448 218) rotate(90)" text-anchor="middle" class="halo bold" style="font-size:10px">흑팀 쪽 계단</text>
  <text x="230" y="357" text-anchor="middle" style="font-size:9px">석상</text>
  <text x="450" y="357" text-anchor="middle" style="font-size:9px">석상</text>
  <text x="160" y="304" text-anchor="middle" class="halo">백팀 자리</text>
  <text x="160" y="318" text-anchor="middle" class="halo" style="font-size:10px">순간이동 · 6명</text>
  <text x="520" y="304" text-anchor="middle" class="halo">흑팀 자리</text>
  <text x="520" y="318" text-anchor="middle" class="halo" style="font-size:10px">순간이동 · 6명</text>
  <text x="108" y="191" style="font-size:9.5px">백 깃발</text>
  <text x="572" y="191" text-anchor="end" style="font-size:9.5px">흑 깃발</text>
  <text x="130" y="487" text-anchor="middle" style="font-size:9.5px">기둥 Ø1.2 m</text>
  <text x="550" y="487" text-anchor="middle" style="font-size:9.5px">기둥 Ø1.2 m</text>
  <text x="340" y="540" text-anchor="middle">정문 · 폭 12 m — 엔드게임 구간에서 들어온다</text>

  <!-- Dimensions -->
  <line class="dim" x1="100" y1="556" x2="580" y2="556"/>
  <line class="dim" x1="100" y1="550" x2="100" y2="562"/>
  <line class="dim" x1="580" y1="550" x2="580" y2="562"/>
  <text x="340" y="572" text-anchor="middle">24 m</text>
  <line class="dim" x1="606" y1="80" x2="606" y2="520"/>
  <line class="dim" x1="600" y1="80" x2="612" y2="80"/>
  <line class="dim" x1="600" y1="520" x2="612" y2="520"/>
  <text transform="translate(622 300) rotate(90)" text-anchor="middle">22 m</text>
  <line x1="652" y1="122" x2="652" y2="90" stroke="#2a2622" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="652" y="136" text-anchor="middle" style="font-size:10px">북</text>

  <!-- Section: PX = 80 + (z - 6) * 34, PY = 812 - y * 34 -->
  <text x="80" y="624" class="bold" style="font-size:12px">남–북 단면 — 가운데(x = 0)를 잘라 서쪽에서 본 모습 (z 6 ~ 22)</text>
  <rect x="80" y="812" width="544" height="10" fill="#e0d9cb"/>
  <line x1="80" y1="812" x2="624" y2="812" stroke="#2a2622" stroke-width="2"/>
  <rect x="624" y="642" width="10" height="180" fill="#bdb4a4" stroke="#2a2622"/>
  <polygon points="148,812 148,803.5 173.5,803.5 173.5,795 199,795 199,786.5 224.5,786.5 224.5,778 250,778 250,769.5 522,769.5 522,812"
           fill="#ddd6c9" stroke="#2a2622" stroke-width="1.5"/>
  <line x1="135" y1="812" x2="263" y2="769.5" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="176" y="772" class="halo" style="font-size:9.5px;fill:#b03a2e">걷는 경사 18.4°</text>
  <line x1="284" y1="769.5" x2="488" y2="769.5" stroke="#d9a514" stroke-width="5"/>
  <rect x="474" y="752.5" width="41" height="17" fill="#6f5210" stroke="#3d2c06"/>
  <rect x="505" y="681" width="10" height="71.5" fill="#6f5210" stroke="#3d2c06"/>
  <rect x="454" y="645.5" width="170" height="7" fill="#5b3c8c" fill-opacity="0.85"/>
  <polygon points="374,676 374,664 380,670 386,660 392,670 398,664 398,676" fill="#e9b824" stroke="#8a6407"/>

  <!-- Pawns, 1 m tall -->
  <g fill="#ffffff" stroke="#2a2622" stroke-width="1.5">
    <rect x="95" y="808" width="18" height="4"/>
    <polygon points="98,808 100,792 108,792 110,808"/>
    <circle cx="104" cy="785" r="7"/>
  </g>
  <g fill="#222222" stroke="#000000" stroke-width="1.5">
    <rect x="343" y="765.5" width="18" height="4"/>
    <polygon points="346,765.5 348,749.5 356,749.5 358,765.5"/>
    <circle cx="352" cy="742.5" r="7"/>
  </g>
  <g fill="#ffffff" stroke="#2a2622" stroke-width="1.5">
    <ellipse cx="566" cy="806" rx="14" ry="5"/>
    <circle cx="585" cy="805" r="6"/>
  </g>

  <!-- Section labels -->
  <line x1="86" y1="700" x2="86" y2="652" stroke="#2a2622" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="94" y="664" style="font-size:10px">천장 14 m (회색 상자는 벽 8 m)</text>
  <text x="539" y="640" text-anchor="middle" style="font-size:9.5px">닫집 (북쪽 벽까지)</text>
  <text x="386" y="654" text-anchor="middle" style="font-size:9.5px">떠 있는 왕관</text>
  <text x="386" y="796" text-anchor="middle" style="font-size:10px">왕좌 발판 6 m</text>
  <line class="dim" x1="532" y1="769.5" x2="532" y2="812"/>
  <line class="dim" x1="528" y1="769.5" x2="536" y2="769.5"/>
  <text x="539" y="788" style="font-size:10px">1.25 m 절벽</text>
  <text x="80" y="840" style="font-size:10px">← 정문 쪽</text>
  <text x="150" y="840" style="font-size:10px">계단 5단(0.25 m × 0.75 m) · 밟는 면은 그 밑의 경사</text>
  <text x="573" y="840" text-anchor="middle" style="font-size:10px">던져진 폰 · 뒤 통로</text>

  <!-- Legend -->
  <circle cx="46" cy="870" r="7" fill="#e9b824" fill-opacity="0.5" stroke="#b07f08" stroke-width="2"/>
  <text x="58" y="874">왕좌 발판(판정)</text>
  <rect x="160" y="864" width="14" height="12" fill="#a8232b" fill-opacity="0.8"/>
  <text x="180" y="874">붉은 융단</text>
  <circle cx="246" cy="870" r="6" fill="#ffffff" stroke="#2a2622" stroke-width="2"/>
  <text x="258" y="874">백팀 자리</text>
  <circle cx="322" cy="870" r="6" fill="#222222" stroke="#000000" stroke-width="2"/>
  <text x="334" y="874">흑팀 자리</text>
  <circle cx="398" cy="870" r="7" fill="#d6cfc1" stroke="#6d665b" stroke-width="2"/>
  <text x="410" y="874">기둥</text>
  <line x1="446" y1="870" x2="468" y2="870" stroke="#2a2622" stroke-width="5"/>
  <text x="474" y="874">절벽</text>
  <rect x="512" y="863" width="8" height="14" fill="#cbc2b1"/>
  <rect x="520" y="863" width="8" height="14" fill="#ddd6c9"/>
  <rect x="528" y="863" width="8" height="14" fill="#f3efe8" stroke="#8f8676" stroke-width="0.5"/>
  <text x="542" y="874">계단 · 밝을수록 높다</text>
  <text x="40" y="900" style="font-size:10.5px">규칙(순간이동 · 과반 · 목표 30초, 깬 미니게임 하나당 −5초)은 지금 왕좌 차지전(R707) 그대로, 시작 뒤 3초 대치.</text>
  <text x="40" y="916" style="font-size:10.5px">달리기 2.5 · 질주 3.6 m/s, 점프 약 0.9 m — 팀 자리에서 발판까지 6 m, 달려 약 2.4초.</text>
</svg>

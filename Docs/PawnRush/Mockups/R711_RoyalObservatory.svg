<text x="574" y="948" font-size="12.5" fill="#d8cfba">낙사 비트 4곳(③ ④ ⑤ ⑥), 아래 단으로 떨어지는 비트 1곳(⑦). 새 장치는 망원경 밀대 하나, 나머지는 기존 장치의 설정만 바꾼다.</text>
<text x="574" y="970" font-size="12.5" fill="#a39a85">설계 초안 + 회색 상자(R712)를 지으며 바꾼 곳 반영. 사람이 달려 본 것은 아니다 — 상세: Docs/PawnRush/PAWN_RUSH_ROYAL_OBSERVATORY_DESIGN_v0.1.md</text>

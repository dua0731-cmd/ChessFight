<rect x="1157" y="162" width="12" height="18" fill="#f6e7a8" fill-opacity=".18" stroke="#f6e7a8" stroke-opacity=".5" stroke-dasharray="3 3"/><text x="1184" y="176" font-size="12" fill="#d8cfba">돔 슬릿 빛기둥</text>


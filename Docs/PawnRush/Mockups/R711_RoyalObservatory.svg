  <text x="1070" y="440">낙사 → CP3 (약 11초)</text>
  <text x="1070" y="480">낙사 → CP4 (약 8초)</text>
  <text x="1070" y="520">낙사 → CP5 (약 10초)</text>
  <text x="1070" y="560">아래 단으로 떨어짐 (약 5초)</text>
</g>

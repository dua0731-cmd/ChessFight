<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" width="100%" style="height:auto;max-width:1400px" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<title>R711 왕실 천문대 레벨 디자인 초안 v0.1 — 위에서 본 배치</title>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ffffff"/></marker>
<marker id="wind" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7fd0e0"/></marker>
<marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e2b23c"/></marker>
<pattern id="grate" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#7c8496"/><path d="M0,0 L1,0 M0,0 L0,1" stroke="#39404f" stroke-width=".18"/></pattern>
</defs>
<rect width="1400" height="1010" fill="#171a22"/>
<text x="24" y="34" font-size="20" font-weight="700" fill="#f4ead2">왕실 천문대 레벨 디자인 초안 v0.1 — 위에서 본 배치 (R711, 회색 상자 R712 반영)</text>
<text x="24" y="58" font-size="13" fill="#a39a85">북쪽이 위 · 좌표는 구간 로컬 (x 동쪽, z 북쪽), 단위 m · 흰 점선 = 진행 경로 · 빨간 점선 = 난간 없는 낭떠러지 · 초록 점 = 체크포인트 · 금색 = 움직이는 장치</text>

<!-- ===================== plan: world metres, x -12..62, z -2..136 ===================== -->
<g transform="translate(40 78) scale(6.5 -6.5) translate(12 -136)">
  <!-- hall shell and dome -->
  <rect x="-10" y="12" width="70" height="99" fill="#0f1320" stroke="#3b4257" stroke-width=".35"/>
  <rect x="44" y="111" width="12" height="20" fill="#0f1320" stroke="#3b4257" stroke-width=".35"/>
  <circle cx="25" cy="72" r="35" fill="none" stroke="#3b4a6b" stroke-width=".25" stroke-dasharray="1.4 1.2"/>
  <rect x="24" y="78" width="2" height="29" fill="#f6e7a8" fill-opacity=".10" stroke="#f6e7a8" stroke-opacity=".35" stroke-width=".12" stroke-dasharray=".8 .8"/>

  <!-- lower level, y 0 -->
  <g fill="#cfc8b6" stroke="#8d8674" stroke-width=".15">
    <rect x="-6" y="0" width="12" height="12"/>
    <rect x="-6.2" y="12" width="12.4" height="26"/>
    <rect x="-6.2" y="38" width="18.2" height="12"/>
    <rect x="12" y="38" width="32" height="12"/>
    <rect x="44" y="38" width="12" height="12"/>
    <rect x="44" y="71" width="12" height="12"/>
    <rect x="31" y="74" width="13" height="6"/>
    <rect x="1" y="71" width="12" height="12"/>
  </g>
  <rect x="47" y="50" width="6" height="21" fill="url(#grate)" stroke="#8d8674" stroke-width=".15"/>

  <!-- upper level, y 6 -->
  <g fill="#a9bfe0" stroke="#6c83a8" stroke-width=".15">
    <rect x="1" y="98" width="12" height="10"/>
    <rect x="13" y="100" width="30" height="6"/>
    <circle cx="50" cy="103" r="7"/>
    <rect x="44" y="103" width="12" height="6.4" stroke="none"/>
    <path d="M44,105.3 L44,109.4 M56,105.3 L56,109.4" fill="none"/>
  </g>
  <!-- top level, y 10.5 - 11.5 -->
  <g fill="#c9b3e6" stroke="#8a72ab" stroke-width=".15">
    <rect x="44" y="110.6" width="12" height="6.4"/>
    <rect x="44" y="117" width="12" height="2" fill="#b49ad6"/>
    <rect x="44" y="119" width="12" height="12"/>
  </g>
  <line x1="44" y1="131" x2="56" y2="131" stroke="#604b72" stroke-width=".7"/>

  <!-- beat 1: ring court -->
  <g fill="#2a3a63" stroke="#e2b23c" stroke-width=".3">
    <circle cx="0" cy="18.4" r="6.2"/>
    <circle cx="0" cy="31.6" r="6.2"/>
    <line x1="-5.37" y1="15.3" x2="5.37" y2="21.5" stroke-width=".55"/>
    <line x1="-5.37" y1="34.7" x2="5.37" y2="28.5" stroke-width=".55"/>
    <line x1="0" y1="31.6" x2="-4.4" y2="36" stroke-width=".45" stroke-dasharray=".7 .5"/>
  </g>
  <circle cx="0" cy="18.4" r=".9" fill="#e2b23c"/><circle cx="0" cy="31.6" r=".9" fill="#e2b23c"/>

  <!-- beat 2: star-chart belts and shutter shields -->
  <g fill="#2a3a63" stroke="#e2b23c" stroke-width=".15">
    <rect x="14" y="44" width="10" height="6"/><rect x="14" y="38" width="10" height="6"/>
    <rect x="29" y="44" width="10" height="6"/><rect x="29" y="38" width="10" height="6"/>
  </g>
  <g stroke="#e2b23c" stroke-width=".35" marker-end="url(#gold)">
    <line x1="16" y1="47" x2="22" y2="47"/><line x1="22" y1="41" x2="16" y2="41"/>
    <line x1="37" y1="47" x2="31" y2="47"/><line x1="31" y1="41" x2="37" y2="41"/>
  </g>
  <g fill="#e2b23c">
    <rect x="25.2" y="44" width=".7" height="6"/><rect x="27.2" y="38" width=".7" height="6"/>
    <rect x="40.2" y="38" width=".7" height="6"/><rect x="42.2" y="44" width=".7" height="6"/>
  </g>

  <!-- beat 3: vent grate bridge -->
  <g fill="#7fd0e0" fill-opacity=".38">
    <rect x="47" y="53" width="6" height="4"/><rect x="47" y="60" width="6" height="4"/><rect x="47" y="67" width="6" height="4"/>
  </g>
  <g fill="#5c6477" stroke="#e2b23c" stroke-width=".15">
    <rect x="54.6" y="54" width="2" height="2"/><rect x="54.6" y="61" width="2" height="2"/><rect x="54.6" y="68" width="2" height="2"/>
  </g>
  <g stroke="#7fd0e0" stroke-width=".3" marker-end="url(#wind)">
    <line x1="54.4" y1="55" x2="44.6" y2="55"/><line x1="54.4" y1="62" x2="44.6" y2="62"/><line x1="54.4" y1="69" x2="44.6" y2="69"/>
  </g>
  <g stroke="#e0483b" stroke-width=".25" stroke-dasharray=".9 .6">
    <line x1="47" y1="50" x2="47" y2="71"/><line x1="53" y1="50" x2="53" y2="71"/>
  </g>

  <!-- beat 4: the great orrery turntable -->
  <circle cx="22" cy="77" r="9" fill="#2a3a63" stroke="#e0483b" stroke-width=".25" stroke-dasharray=".9 .6"/>
  <circle cx="22" cy="77" r="6.5" fill="none" stroke="#e2b23c" stroke-opacity=".5" stroke-width=".12"/>
  <line x1="14.2" y1="72.5" x2="29.8" y2="81.5" stroke="#e2b23c" stroke-width=".55"/>
  <line x1="22" y1="77" x2="18.25" y2="83.5" stroke="#e2b23c" stroke-width=".3" stroke-dasharray=".7 .5"/>
  <circle cx="18.25" cy="83.5" r="1" fill="#e2b23c"/>
  <circle cx="22" cy="77" r="1.5" fill="#e2b23c"/>

  <!-- beat 5: planet lifts -->
  <g fill="#2a3a63" stroke="#e2b23c" stroke-width=".2">
    <rect x="4" y="83.2" width="6" height="5"/><rect x="4" y="92.6" width="6" height="5"/>
    <rect x="4" y="88.4" width="6" height="4" fill="#bfc4c9" stroke="#8d8674"/>
  </g>
  <line x1="2.5" y1="90.4" x2="11.5" y2="90.4" stroke="#e2b23c" stroke-width=".3" stroke-dasharray=".7 .5"/>
  <circle cx="9" cy="90.4" r=".8" fill="#e2b23c"/>

  <!-- beat 6: telescope bridge -->
  <g fill="#e2b23c" fill-opacity=".38">
    <rect x="17" y="100" width="4" height="6"/><rect x="25" y="100" width="4" height="6"/><rect x="33" y="100" width="4" height="6"/>
  </g>
  <g fill="#2a3a63" stroke="#e2b23c" stroke-width=".18">
    <rect x="18.2" y="106.4" width="1.6" height="4.2"/><rect x="26.2" y="106.4" width="1.6" height="4.2"/><rect x="34.2" y="106.4" width="1.6" height="4.2"/>
  </g>
  <g fill="#e2b23c">
    <rect x="17" y="105.9" width="4" height=".6"/><rect x="25" y="105.9" width="4" height=".6"/><rect x="33" y="105.9" width="4" height=".6"/>
  </g>
  <g stroke="#e2b23c" stroke-width=".3" marker-end="url(#gold)">
    <line x1="19" y1="105.4" x2="19" y2="99"/><line x1="27" y1="105.4" x2="27" y2="99"/><line x1="35" y1="105.4" x2="35" y2="99"/>
  </g>
  <line x1="13" y1="100" x2="43" y2="100" stroke="#e0483b" stroke-width=".25" stroke-dasharray=".9 .6"/>
  <line x1="13" y1="106" x2="43" y2="106" stroke="#6c83a8" stroke-width=".4"/>

  <!-- beat 7: constellation climbing wall, two tiers -->
  <rect x="44" y="109.4" width="12" height="1.2" fill="#f1ead8" stroke="#e2b23c" stroke-width=".2"/>
  <g fill="#e2b23c">
    <circle cx="45.5" cy="109.75" r=".22"/><circle cx="47.5" cy="110.25" r=".22"/><circle cx="49.5" cy="109.75" r=".22"/><circle cx="51.5" cy="110.25" r=".22"/><circle cx="53.5" cy="109.75" r=".22"/><circle cx="55" cy="110.25" r=".22"/>
  </g>

  <!-- route -->
  <path d="M0,1 L0,44 L50,44 L50,77 L31,77 Q22,90 13,77 L7,77 L7,103 L43,103 L50,103 L50,129" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width=".32" stroke-dasharray="1.3 .9" marker-end="url(#tip)"/>

  <!-- checkpoints -->
  <g fill="#5fd08a" stroke="#0f1320" stroke-width=".2">
    <circle cx="0" cy="6" r="1"/><circle cx="3" cy="44" r="1"/><circle cx="50" cy="44" r="1"/><circle cx="50" cy="77" r="1"/>
    <circle cx="7" cy="77" r="1"/><circle cx="7" cy="103" r="1"/><circle cx="50" cy="103" r="1"/><circle cx="50" cy="114" r="1"/>
  </g>

  <!-- labels (un-flipped) -->
  <g font-size="12" font-weight="700" fill="#f4ead2">
    <text transform="translate(8 3) scale(.1538 -.1538)">입구 (앞 복도에서)</text>
    <text transform="translate(8 24) scale(.1538 -.1538)">① 고리 마당</text>
    <text transform="translate(13 52.5) scale(.1538 -.1538)">② 별지도 벨트 · 차양 방패</text>
    <text transform="translate(45.5 60) scale(.1538 -.1538)" text-anchor="end">③ 환기구 격자 다리</text>
    <text transform="translate(-9 66) scale(.1538 -.1538)">④ 대천구의 회전판</text>
    <text transform="translate(16.5 91) scale(.1538 -.1538)">⑤ 행성 승강대</text>
    <text transform="translate(28 96.5) scale(.1538 -.1538)" text-anchor="middle">⑥ 망원경 다리</text>
    <text transform="translate(42.5 115.5) scale(.1538 -.1538)" text-anchor="end">⑦ 별자리 등반벽</text>
    <text transform="translate(42.5 126) scale(.1538 -.1538)" text-anchor="end">출구 (엔딩 구간으로)</text>
  </g>
  <g font-size="10.5" fill="#a39a85">
    <text transform="translate(8 20.5) scale(.1538 -.1538)">회전 막대 2곳, 난간 있음</text>
    <text transform="translate(13 35) scale(.1538 -.1538)">벨트 4장(서로 반대로) + 반쪽 방패 2쌍</text>
    <text transform="translate(45.5 56.5) scale(.1538 -.1538)" text-anchor="end">옆바람 3곳, 물결처럼</text>
    <text transform="translate(-9 63) scale(.1538 -.1538)">회전판 지름 18 m + 회전팔 2개</text>
    <text transform="translate(16.5 87.8) scale(.1538 -.1538)">승강대 둘(0 → 6 m) + 턱의 행성 추</text>
    <text transform="translate(28 93.6) scale(.1538 -.1538)" text-anchor="middle">망원경 밀대 3개, 남쪽은 낭떠러지</text>
    <text transform="translate(42.5 112.6) scale(.1538 -.1538)" text-anchor="end">3단 벽 + 턱 위 바람</text>
    <text transform="translate(16 15) scale(.1538 -.1538)">돔 홀 70 × 99 m, 바닥 아래 허공 18 m</text>
  </g>
  <g font-size="9.5" fill="#1c2233" font-weight="700">
    <text transform="translate(-5.4 39.2) scale(.1538 -.1538)">y 0</text>
    <text transform="translate(1.6 104.8) scale(.1538 -.1538)">y 6</text>
    <text transform="translate(44.6 120) scale(.1538 -.1538)">y 11.5</text>
    <text transform="translate(44.6 112) scale(.1538 -.1538)">y 10.5</text>
  </g>
</g>


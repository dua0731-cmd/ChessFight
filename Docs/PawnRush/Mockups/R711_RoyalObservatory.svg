</g>
<g font-size="12" fill="#d8cfba">
  <text x="760" y="320">낮은 회전 막대 100°/초 2곳 + 높은 막대 1</text>
  <text x="760" y="360">컨베이어 4장 1.5 m/s + 반쪽 방패 2쌍(4.5초)</text>
  <text x="760" y="400">옆바람 3곳 5초 주기, 1.7초씩 어긋난 물결</text>
  <text x="760" y="440">회전판 15°/초 + 낮은 팔 + 천구 달린 팔</text>
  <text x="760" y="480">승강대 2(5초) + 가운데 턱의 행성 추 1</text>
  <text x="760" y="520">망원경 밀대 3개 4.5초, 한쪽 난간 없음</text>
  <text x="760" y="560">1.5 m 벽 3단 + 턱 두 곳에 벽에서 부는 바람</text>
</g>

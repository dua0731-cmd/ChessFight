  <text x="574" y="320">① 고리 마당</text>
  <text x="574" y="360">② 별지도 벨트 · 차양 방패</text>
  <text x="574" y="400">③ 환기구 격자 다리</text>
  <text x="574" y="440">④ 대천구의 회전판</text>

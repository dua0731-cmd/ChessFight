  <text x="620" y="492" text-anchor="middle" class="t">C · 원형 돔 (중앙 섬과 해자)</text>
  <text x="620" y="508" text-anchor="middle" class="s">지름 44 m · 천장 30 m · 바닥은 4 m 칸 체스판</text>
  <text x="620" y="522" text-anchor="middle" class="s">가운데 네 칸이 섬(0.6 m), 다리 4개</text>


  <text x="935" y="236" text-anchor="middle" class="s" style="font-size:9.5px">등받이 14 m</text>
  <text x="935" y="357" text-anchor="middle" class="s" style="font-size:9px;fill:#ffffff">책 계단</text>
  <text x="935" y="318" text-anchor="middle" class="s" style="font-size:9px">발받침 1.5 m</text>
  <text x="935" y="492" text-anchor="middle" class="t">D · 거인의 왕좌 (장난감 크기)</text>
  <text x="935" y="508" text-anchor="middle" class="s">34 × 44 m · 천장 32 m</text>
  <text x="935" y="522" text-anchor="middle" class="s">왕좌 방석(3 m 높이)이 발판</text>

  <!-- ======================= Sections from the door: X = cx + 6x, Y = 830 - 6y ======================= -->
  <text x="40" y="566" class="t">정문에서 본 단면 — 높이 비교 (작은 흰 기둥 모양 = 폰 1 m)</text>

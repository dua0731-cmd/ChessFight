  <text x="350" y="508" text-anchor="middle" class="s">30 × 64 m · 천장 24 m · 기둥 두 줄</text>
  <text x="350" y="522" text-anchor="middle" class="s">높은 계단 제단 2.5 m, 발판 7 m</text>


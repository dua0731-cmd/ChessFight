  <line class="guide" x1="40" y1="710" x2="1060" y2="710"/><text x="40" y="706" class="s">20 m</text>
  <line class="guide" x1="40" y1="650" x2="1060" y2="650"/><text x="40" y="646" class="s">30 m</text>
  <line x1="40" y1="830" x2="1060" y2="830" stroke="#2a2622" stroke-width="2"/>


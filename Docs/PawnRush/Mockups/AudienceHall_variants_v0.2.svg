  <!-- Legend -->
  <circle cx="48" cy="900" r="7" class="plat"/><text x="60" y="904">왕좌 발판(판정)</text>
  <rect x="160" y="893" width="16" height="14" class="stair"/><text x="182" y="904">계단</text>
  <rect x="228" y="893" width="16" height="14" class="top"/><text x="250" y="904">단상 윗면</text>
  <rect x="318" y="893" width="16" height="14" class="pit"/><text x="340" y="904">해자(떨어지면 잡힌 말)</text>
  <rect x="470" y="893" width="16" height="14" class="carpet"/><text x="492" y="904">융단</text>
  <circle cx="545" cy="900" r="4" class="w"/><circle cx="557" cy="900" r="4" class="b"/><text x="568" y="904">팀이 서는 자리(소환 뒤)</text>
  <rect x="712" y="893" width="16" height="14" class="throne"/><text x="734" y="904">왕좌</text>
  <text x="40" y="940" class="s">공통 생각: 홀은 눈으로 보기에 거대하게, 싸우는 자리는 촘촘하게 — 폰은 초속 2.5 m(전력 3.6 m)라 50 m를 달리면 약 14~20초가 걸린다.</text>
  <text x="40" y="958" class="s">그래서 B · C · D 모두 팀이 서는 자리는 발판에서 8~12 m 안쪽이고, 넓은 공간은 들어오는 길과 머리 위(천장 · 돔 · 거대한 왕좌)에 쓴다.</text>
  <text x="40" y="976" class="s">규칙은 모두 지금의 왕좌 차지전(팀 과반이 발판 위에 있는 동안 시간이 쌓임) 그대로이고, 판마다 바뀌는 것은 공간과 발판의 생김새다.</text>
</svg>

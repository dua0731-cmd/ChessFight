<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <pattern id="board" x="524" y="242" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#e9e2d3"/>
      <rect width="24" height="24" fill="#cfc6b4"/>
      <rect x="24" y="24" width="24" height="24" fill="#cfc6b4"/>
    </pattern>
    <style>
      text { fill: #2a2622; font-size: 11px; }
      .t { font-weight: 700; font-size: 13px; }
      .s { font-size: 10.5px; }
      .floor { fill: #ece6da; }
      .wall { fill: none; stroke: #2a2622; stroke-width: 3; }
      .stair { fill: #d4ccbd; stroke: #8f8676; stroke-width: .8; }
      .top { fill: #f3efe8; stroke: #8f8676; stroke-width: .8; }
      .plat { fill: #e9b824; fill-opacity: .4; stroke: #b07f08; stroke-width: 2; }
      .throne { fill: #6f5210; }
      .col { fill: #d6cfc1; stroke: #6d665b; stroke-width: 1; }
      .pit { fill: #2f3440; }
      .carpet { fill: #a8232b; fill-opacity: .7; }
      .w { fill: #ffffff; stroke: #2a2622; stroke-width: 1.2; }
      .b { fill: #222222; stroke: #000000; stroke-width: 1.2; }
      .guide { stroke: #b9b2a5; stroke-width: 1; stroke-dasharray: 4 4; }
      .shade { fill: #2a2622; fill-opacity: .06; }
    </style>
  </defs>
  <rect width="1100" height="1000" fill="#faf8f3"/>
  <text x="40" y="32" style="font-size:18px;font-weight:700">국왕 알현실 변형안 v0.2 · 같은 축척으로 비교</text>
  <text x="40" y="52" style="font-size:12px">위: 위에서 본 모습(정문이 아래) · 아래: 정문에서 본 단면(높이) · 1 m = 6 px · 2026-11-21 제안, 아직 짓기 전 · 숫자는 시작값</text>


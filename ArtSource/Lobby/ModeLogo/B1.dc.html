      <g fill="{{b.fill}}" stroke="{{b.ink}}" style="stroke-width:4.5;stroke-linejoin:round">
        <path d="M22 12 H36 V22 H44 V12 H56 V22 H64 V12 H78 V40 H22 Z"/>
        <path d="M30 40 H70 L66 92 H34 Z"/>
        <rect x="26" y="84" width="48" height="10" rx="4"/>
        <rect x="18" y="92" width="64" height="17" rx="6"/>

  <div style="position: absolute; left: 304px; top: 21px; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: #FBEFD5; border: 3px solid {{t.ink}}"></div>
  <div style="position: absolute; left: 182px; top: 34px; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: #2E2622; border: 3px solid {{t.ink}}"></div>

  <div style="position: absolute; left: 365px; top: 398px; width: 11px; height: 11px; box-sizing: border-box; transform: rotate(45deg); background: #2E2622; border: 2px solid {{t.ink}}"></div>

<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pawn","rook"],"default":"pawn"},"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const TURN = 'repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08) 0px 1px, rgba(0,0,0,0.06) 1px 3px)';
    const GRAIN = 'repeating-linear-gradient(91deg, rgba(0,0,0,0.16) 0px 2px, rgba(0,0,0,0) 2px 9px), repeating-linear-gradient(87deg, rgba(255,226,170,0.07) 0px 1px, rgba(0,0,0,0) 1px 5px)';
    const GOLD = '#8a6424, #f6dc9a, #b8873a, #fff3cf, #9c7230, #e9c67a, #7a5520, #f1d48c, #8a6424';
    const t = { bg: 'radial-gradient(ellipse at 50% 45%, #3a2a1a 0%, #140d08 75%)', metal: TURN + ', conic-gradient(from 210deg, ' + GOLD + ')', metalAlt: TURN + ', conic-gradient(from 30deg, ' + GOLD + ')', metalFlat: '#E9C67A', metalHi: '#FFF0C4', metalLo: '#9C7230', ink: '#2A1C0C', glass: 'radial-gradient(circle at 50% 28%, #6b5236 0%, #2e2114 55%, #160f09 100%)', hair: '#E9C67A', wood: GRAIN + ', linear-gradient(180deg, #6b4526 0%, #4a2d17 55%, #3a2312 100%)', woodDark: GRAIN + ', linear-gradient(180deg, #4a2d17 0%, #2c1a0c 100%)', checkA: '#C9B48E', checkB: '#5A3D2A', steel: '#EEF2F5', steelLo: '#A9B7C2', grip: '#5A3D2A' };
    const w = { fill: '#FBEFD5', shade: '#D9C08A', hi: '#FFFFFF', ink: '#2A1C0C' };
    const b = { fill: '#2E2622', shade: '#16110E', hi: '#7A6656', ink: '#E9C67A' };
    const rook = (this.props.mode ?? 'pawn') === 'rook';
    // Sword Fight in silver (user 11-23), Pawn Rush in gold
    const SILVER = '#5a5f66, #eef1f4, #8a9099, #ffffff, #6b7079, #d4d8de, #4c5158, #e2e5ea, #5a5f66';
    const ts = Object.assign({}, t, { metal: TURN + ', conic-gradient(from 210deg, ' + SILVER + ')', metalFlat: '#C9CED6', metalHi: '#FFFFFF', metalLo: '#7E848D', ink: '#1E1C1B', glass: 'radial-gradient(circle at 50% 28%, #57524e 0%, #272422 55%, #121110 100%)', hair: '#D4D8DE' });
    const bs = Object.assign({}, b, { ink: '#D4D8DE' });
    return { t: rook ? ts : t, w: w, b: rook ? bs : b, rook: rook, pawn: !rook };
  }
}
</script>

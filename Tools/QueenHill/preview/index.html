// Unity (left-handed) to three.js (right-handed): z flips; a rotation's quaternion becomes (-x,-y,z,w).

  const dist = Math.hypot(a[0], a[1], a[2]), v = a[3], pause = a[4];
  if (v <= 0 || dist < 1e-4) return 0;

  if (u < pause) return 0; u -= pause;
  if (u < leg) return cov(u) / dist; u -= leg;

  const ax = new THREE.Vector3(a[3], a[4], a[5]).normalize();
  let u = new THREE.Vector3().crossVectors(ax, new THREE.Vector3(0, 1, 0));
  if (u.lengthSq() < 1e-6) u.set(1, 0, 0); u.normalize();
  const w = new THREE.Vector3().crossVectors(ax, u);

    if (Math.abs(a[6]) > 1e-4) rot = rot.clone().multiply(axisAngle([a[7], a[8], a[9]], a[6] * (T)));

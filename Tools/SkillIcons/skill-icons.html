<!doctype html>
<!--
  Pawn Rush skill pictures for the developers' skill tree (K). The user, 2026-11-24: "스킬트리에서 스킬 이름만 나오지 말고
  이미지도 같이 보였으면 좋겠는데" and "기물 아이콘을 넣는게 아니라 스킬이 뭔지 한눈에 보여주는 이미지를 넣어야지":
  each picture shows what the skill does - the stone rolling, the kick behind, the puddle - with the game's own piece
  pictures (Assets/Resources/Loading/ChessIcons: white = us, black = them) as the actors.

  Each picture is drawn here from a few shapes. To make the PNGs again: Tools/SkillIcons/make-icons.ps1 (headless Edge
  shoots this page on a clear background, slice_icons.py cuts it into Assets/Resources/PawnRushSkillIcons/<Name>.png,
  the names being PawnRushSkillIds' constants). ?review shows them big with their small size and names, for a look.
-->
<html><head><meta charset="utf-8"><title>Pawn Rush skill icons</title>
<style>
html,body{margin:0;background:transparent;font-family:'Malgun Gothic',sans-serif}
#sheet{display:grid;grid-template-columns:repeat(10,128px);grid-auto-rows:128px}
#sheet svg{display:block}
body.review{background:#0d121f;color:#dfe5ef}
body.review #sheet{grid-template-columns:repeat(5,196px);grid-auto-rows:162px;gap:6px;padding:8px}
.cell{position:relative}
.cell .small{position:absolute;left:132px;top:4px}
.cell .tiny{position:absolute;left:132px;top:52px}
.cell .name{position:absolute;left:0;top:130px;width:196px;font-size:13px;white-space:nowrap;overflow:hidden}
</style></head><body>
<div id="sheet"></div>
<script>
const DIR = '../../Assets/Resources/Loading/ChessIcons/';
const INK = '#231B16', CREAM = '#F4EEDC', GOLD = '#FFCF3A', RED = '#F0473E', WATER = '#5FD0F5', STEEL = '#E3E9F1',
  ROPE = '#D9A15A', WOOD = '#9A6A3E', BRICK = '#D7C29F', GREYSTONE = '#AEB3BD';
const PLATES = {
  Pawn: ['#7DD487', '#2E8A4C'], Knight: ['#FFB65E', '#CF6721'], Bishop: ['#B99AF7', '#6544C2'],
  Rook: ['#6AB2F7', '#2C61C0'], Queen: ['#FF8AA9', '#C13963'], King: ['#F6D35E', '#BC881C'], None: ['#9AA1B0', '#525A6B'],
};
let UID = 0;
const n1 = v => Math.round(v * 10) / 10;
const pts = a => a.map(p => n1(p[0]) + ',' + n1(p[1])).join(' ');
const pd = a => 'M' + a.map(p => n1(p[0]) + ' ' + n1(p[1])).join(' L');
const rad = d => d * Math.PI / 180;

// ---------------------------------------------------------------- shapes

// One of the game's piece pictures standing on (x, by), s its picture's size; r turns it round its foot, f faces it the
// other way (the knight looks left as drawn), sx/sy squash it.
function P(kind, team, x, by, s, o = {}) {
  let t = `translate(${n1(x)} ${n1(by)})`;
  if (o.r) t += ` rotate(${o.r})`;
  const sx = (o.f ? -1 : 1) * (o.sx || 1), sy = o.sy || 1;
  if (sx !== 1 || sy !== 1) t += ` scale(${sx} ${sy})`;
  return `<g transform="${t}"${o.op != null ? ` opacity="${o.op}"` : ''}><image href="${DIR}${kind}_${team === 'b' ? 'Black' : 'White'}.png" x="${n1(-s / 2)}" y="${n1(-0.94 * s)}" width="${s}" height="${s}"/></g>`;
}
const sh = (x, y, rx, ry, op = 0.25) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry ?? rx * 0.3}" fill="${INK}" opacity="${op}"/>`;
// A line with an ink edge.
function ln(a, col, w = 6, extra = '') {
  const d = typeof a === 'string' ? a : pd(a);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>` +
    `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
}
// A thick arrow along points, its head at the last.
function arrow(a, col = GOLD, w = 7, hl, hw) {
  hl = hl ?? w * 1.8 + 4; hw = hw ?? w * 1.4 + 4;
  const tip = a[a.length - 1];
  let i = a.length - 2;
  while (i > 0 && Math.hypot(a[i][0] - tip[0], a[i][1] - tip[1]) < hl) i--;
  const from = a[i], L = Math.hypot(tip[0] - from[0], tip[1] - from[1]) || 1;
  const ux = (tip[0] - from[0]) / L, uy = (tip[1] - from[1]) / L, bx = tip[0] - ux * hl, by = tip[1] - uy * hl;
  const shaft = a.slice(0, i + 1).concat([[bx + ux * 2, by + uy * 2]]);
  const head = [tip, [bx - uy * hw, by + ux * hw], [bx + uy * hw, by - ux * hw]];
  return `<path d="${pd(shaft)}" fill="none" stroke="${INK}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<polygon points="${pts(head)}" fill="${INK}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>` +
    `<path d="${pd(shaft)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<polygon points="${pts(head)}" fill="${col}"/>`;
}
function q(p0, c, p1, n = 18) {
  const r = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; r.push([u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]]); }
  return r;
}
function arc(cx, cy, rx, ry, a0, a1, n = 28) {
  const r = [];
  for (let i = 0; i <= n; i++) { const a = rad(a0 + (a1 - a0) * i / n); r.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return r;
}
// A dotted trail (a jump's path).
const trail = (a, col = '#fff', w = 4) => `<path d="${pd(a)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="0.1 ${w * 2.3}" opacity=".95"/>`;
function burst(x, y, R, r, n = 8, rot = 0, col = GOLD) {
  const a = [], b = [];
  for (let i = 0; i < n * 2; i++) { const t = rad(rot + i * 180 / n), k = i % 2 ? r : R; a.push([x + Math.cos(t) * k, y + Math.sin(t) * k]); b.push([x + Math.cos(t) * k * 0.5, y + Math.sin(t) * k * 0.5]); }
  return `<polygon points="${pts(a)}" fill="${col}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><polygon points="${pts(b)}" fill="#fff"/>`;
}
function star(x, y, R, r, n, rot, col, w = 3.5) {
  const a = [];
  for (let i = 0; i < n * 2; i++) { const t = rad(rot + i * 180 / n), k = i % 2 ? r : R; a.push([x + Math.cos(t) * k, y + Math.sin(t) * k]); }
  return `<polygon points="${pts(a)}" fill="${col}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round"/>`;
}
const star5 = (x, y, R, col = GOLD) => star(x, y, R, R * 0.45, 5, -90, col, 2);
// Speed lines behind something moving at ang (degrees), from (x, y) backwards.
function speed(x, y, ang, len, n = 3, gap = 9, w = 4, col = '#fff') {
  const ux = Math.cos(rad(ang)), uy = Math.sin(rad(ang)), px = -uy, py = ux;
  let s = '';
  for (let i = 0; i < n; i++) {
    const o = (i - (n - 1) / 2) * gap, l = len * (i % 2 ? 0.62 : 1), x1 = x + px * o, y1 = y + py * o;
    s += `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x1 - ux * l)}" y2="${n1(y1 - uy * l)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" opacity=".92"/>`;
  }
  return s;
}
const txt = (x, y, s, size = 22, col = GOLD, anchor = 'middle') =>
  `<text x="${x}" y="${y}" font-family="Arial Black, Segoe UI Black, Arial, Segoe UI Symbol" font-weight="900" font-size="${size}" text-anchor="${anchor}" fill="${col}" stroke="${INK}" stroke-width="${n1(size * 0.2)}" stroke-linejoin="round" paint-order="stroke">${s}</text>`;
function spark(x, y, r, col = '#fff') {
  const a = [[x, y - r], [x + r * 0.26, y - r * 0.26], [x + r, y], [x + r * 0.26, y + r * 0.26], [x, y + r], [x - r * 0.26, y + r * 0.26], [x - r, y], [x - r * 0.26, y - r * 0.26]];
  return `<polygon points="${pts(a)}" fill="${col}"/>`;
}
function puffs(list, col = CREAM) {
  return list.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + 1.8}" fill="${INK}"/>`).join('') +
    list.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`).join('');
}
const ring = (x, y, rx, ry, col = GOLD, w = 4, dash = '') =>
  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="${INK}" stroke-width="${w + 4}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>` +
  `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
// Light: a soft wide band, an inked core, a white heart.
function beam(a, b, w = 10, col = GOLD) {
  return `<line x1="${n1(a[0])}" y1="${n1(a[1])}" x2="${n1(b[0])}" y2="${n1(b[1])}" stroke="${col}" stroke-width="${w * 2.2}" stroke-linecap="round" opacity=".35"/>` +
    ln([a, b], col, w * 0.7) +
    `<line x1="${n1(a[0])}" y1="${n1(a[1])}" x2="${n1(b[0])}" y2="${n1(b[1])}" stroke="#fff" stroke-width="${n1(w * 0.28)}" stroke-linecap="round"/>`;
}
function rays(x, y, n, R, col = '#fff', op = 0.3, rot = 0) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const t0 = rad(rot + (i - 0.25) * 360 / n), t1 = rad(rot + (i + 0.25) * 360 / n);
    s += `<polygon points="${pts([[x, y], [x + Math.cos(t0) * R, y + Math.sin(t0) * R], [x + Math.cos(t1) * R, y + Math.sin(t1) * R]])}" fill="${col}" opacity="${op}"/>`;
  }
  return s;
}
const tile = (x, y, w, h, col = RED) => `<polygon points="${pts([[x, y - h / 2], [x + w / 2, y], [x, y + h / 2], [x - w / 2, y]])}" fill="${col}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
function blob(a) {
  const n = a.length;
  let d = `M${n1(a[0][0])} ${n1(a[0][1])}`;
  for (let i = 0; i < n; i++) {
    const p0 = a[(i - 1 + n) % n], p1 = a[i], p2 = a[(i + 1) % n], p3 = a[(i + 2) % n];
    d += ` C${n1(p1[0] + (p2[0] - p0[0]) / 6)} ${n1(p1[1] + (p2[1] - p0[1]) / 6)} ${n1(p2[0] - (p3[0] - p1[0]) / 6)} ${n1(p2[1] - (p3[1] - p1[1]) / 6)} ${n1(p2[0])} ${n1(p2[1])}`;
  }
  return d + 'Z';
}
function stone(x, y, r) {
  const k = [1, 0.94, 1.03, 0.92, 0.99, 1.05, 0.93, 1.01, 0.96];
  const a = k.map((v, i) => [x + Math.cos(rad(i * 40 + 10)) * r * v, y + Math.sin(rad(i * 40 + 10)) * r * v]);
  return `<path d="${blob(a)}" fill="#B9B2A5" stroke="${INK}" stroke-width="3.5"/>` +
    `<path d="M${x + r * 0.95} ${y + r * 0.1} Q${x + r * 0.7} ${y + r * 0.85} ${x - r * 0.1} ${y + r * 0.98} Q${x + r * 0.55} ${y + r * 0.45} ${x + r * 0.95} ${y + r * 0.1}Z" fill="${INK}" opacity=".22"/>` +
    `<ellipse cx="${x - r * 0.38}" cy="${y - r * 0.42}" rx="${r * 0.3}" ry="${r * 0.18}" transform="rotate(-30 ${x - r * 0.38} ${y - r * 0.42})" fill="#fff" opacity=".55"/>` +
    `<path d="M${x + r * 0.1} ${y - r * 0.6} L${x + r * 0.25} ${y - r * 0.2} L${x + r * 0.05} ${y + r * 0.15} M${x + r * 0.25} ${y - r * 0.2} L${x + r * 0.55} ${y - r * 0.05}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
}
const ball = (x, y, r, col = '#56504A') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="${INK}" stroke-width="3"/><circle cx="${n1(x - r * 0.35)}" cy="${n1(y - r * 0.35)}" r="${n1(r * 0.3)}" fill="#fff" opacity=".7"/>`;
function flask(x, y, s = 1, rot = 0) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">` +
    `<path d="M-5.5 -20 L-5.5 -9 A16 16 0 1 0 5.5 -9 L5.5 -20 Z" fill="#DDF4FC" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>` +
    `<path d="M-15.2 4 A16 16 0 0 0 15.2 4 Z" fill="${WATER}"/>` +
    `<path d="M-15.2 4 A16 16 0 0 0 15.2 4" fill="none" stroke="${INK}" stroke-width="3.5"/>` +
    `<path d="M-5.5 -9 A16 16 0 1 0 5.5 -9" fill="none" stroke="${INK}" stroke-width="3.5"/>` +
    `<rect x="-7.5" y="-28" width="15" height="9" rx="2.5" fill="${WOOD}" stroke="${INK}" stroke-width="3"/>` +
    `<path d="M0 -3 V15 M-7 4 H7" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>` +
    `<path d="M-10 -3 A10 10 0 0 1 -4 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>`;
}
// A sword, its grip at (x, y), pointing at rot (0 = up).
function sword(x, y, L, rot) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})">` +
    `<polygon points="0,${-L} 7,${-L + 12} 7,-8 -7,-8 -7,${-L + 12}" fill="${STEEL}" stroke="${INK}" stroke-width="3.2" stroke-linejoin="round"/>` +
    `<line x1="0" y1="${-L + 10}" x2="0" y2="-10" stroke="#98A6BB" stroke-width="2.4"/>` +
    `<rect x="-17" y="-9" width="34" height="8" rx="3.5" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>` +
    `<rect x="-4" y="-1" width="8" height="15" fill="${WOOD}" stroke="${INK}" stroke-width="3"/>` +
    `<circle cx="0" cy="18" r="5.5" fill="${GOLD}" stroke="${INK}" stroke-width="3"/></g>`;
}
function chain(a, b, link = 11) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), n = Math.max(2, Math.round(L / link)), ang = Math.atan2(dy, dx) * 180 / Math.PI;
  let s = '';
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, tr = `translate(${n1(a[0] + dx * t)} ${n1(a[1] + dy * t)}) rotate(${n1(ang)})`;
    s += i % 2
      ? `<rect x="${n1(-link * 0.66)}" y="-2.8" width="${n1(link * 1.32)}" height="5.6" rx="2.8" fill="#AFB8C6" stroke="${INK}" stroke-width="2.4" transform="${tr}"/>`
      : `<ellipse rx="${n1(link * 0.66)}" ry="${n1(link * 0.4)}" fill="none" stroke="${INK}" stroke-width="7" transform="${tr}"/><ellipse rx="${n1(link * 0.66)}" ry="${n1(link * 0.4)}" fill="none" stroke="#D2D8E2" stroke-width="3.2" transform="${tr}"/>`;
  }
  return s;
}
const hook = (x, y, rot, s = 1) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">${ln('M0 -9 L0 5 A8 8 0 1 1 -14 3', '#D2D8E2', 4.5)}</g>`;
function wall(x, y, w, h, col = BRICK, bh = 10) {
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`;
  let row = 0;
  for (let yy = y + bh; yy < y + h - 2; yy += bh) s += `<line x1="${x}" y1="${yy}" x2="${x + w}" y2="${yy}" stroke="${INK}" stroke-width="2" opacity=".5"/>`;
  for (let yy = y; yy < y + h - 2; yy += bh, row++)
    for (let xx = x + (row % 2 ? 9 : 18); xx < x + w - 3; xx += 18)
      s += `<line x1="${xx}" y1="${yy}" x2="${xx}" y2="${Math.min(yy + bh, y + h)}" stroke="${INK}" stroke-width="2" opacity=".5"/>`;
  return s + `<rect x="${x + 2}" y="${y + 2}" width="${w - 4}" height="3" fill="#fff" opacity=".35"/>`;
}
function merlons(x, y, w, n, col = BRICK) {
  let s = '';
  const mw = w / (n * 2 - 1);
  for (let i = 0; i < n; i++) s += `<rect x="${n1(x + i * mw * 2)}" y="${y - 10}" width="${n1(mw)}" height="12" fill="${col}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>`;
  return s;
}
function wheel(x, y, r) {
  let s = `<circle cx="${x}" cy="${y}" r="${r}" fill="${WOOD}" stroke="${INK}" stroke-width="3.5"/><circle cx="${x}" cy="${y}" r="${r - 4.5}" fill="#C98F52" stroke="${INK}" stroke-width="2"/>`;
  for (let i = 0; i < 6; i++) { const t = rad(i * 60 + 15); s += `<line x1="${x}" y1="${y}" x2="${n1(x + Math.cos(t) * (r - 4.5))}" y2="${n1(y + Math.sin(t) * (r - 4.5))}" stroke="${INK}" stroke-width="2.4"/>`; }
  return s + `<circle cx="${x}" cy="${y}" r="3.5" fill="${GOLD}" stroke="${INK}" stroke-width="2"/>`;
}
function foot(x, y, rot, s = 1, col = CREAM) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><ellipse cx="0" cy="-5" rx="7.5" ry="11.5" fill="${col}" stroke="${INK}" stroke-width="3"/><ellipse cx="0" cy="11.5" rx="5.8" ry="5.8" fill="${col}" stroke="${INK}" stroke-width="3"/></g>`;
}
function hand(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})">` +
    `<rect x="-33" y="-11" width="12" height="24" rx="3" fill="#E6DCC3" stroke="${INK}" stroke-width="3"/>` +
    `<rect x="-23" y="-13" width="28" height="28" rx="10" fill="${CREAM}" stroke="${INK}" stroke-width="3.5"/>` +
    `<rect x="-3" y="-13" width="31" height="11" rx="5.5" fill="${CREAM}" stroke="${INK}" stroke-width="3.5"/>` +
    `<path d="M-6 2 H3 M-6 8 H2" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/></g>`;
}
function spear(x1, y1, x2, y2) {
  const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L, px = -uy, py = ux, b = [x2 - ux * 15, y2 - uy * 15];
  return ln([[x1, y1], b], WOOD, 4.5) + `<polygon points="${pts([[x2, y2], [b[0] + px * 7, b[1] + py * 7], [b[0] - ux * 3, b[1] - uy * 3], [b[0] - px * 7, b[1] - py * 7]])}" fill="${STEEL}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
}
function bolas(x, y, rot) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})">` +
    `<circle r="24" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 7" opacity=".9"/>` +
    ln('M-18 7 Q-2 -12 18 -7', ROPE, 3.2) + ball(-18, 7, 8.5) + ball(18, -7, 8.5) + `</g>`;
}
function target(x, y, r, col = RED) {
  let s = `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${INK}" stroke-width="8"/><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${col}" stroke-width="4"/>`;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) s += ln([[x + dx * (r - 6), y + dy * (r - 6)], [x + dx * (r + 6), y + dy * (r + 6)]], col, 3);
  return s + `<circle cx="${x}" cy="${y}" r="3" fill="${col}" stroke="${INK}" stroke-width="1.5"/>`;
}
function gift(x, y, w, h) {
  const c = '#E8473F';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" stroke="${INK}" stroke-width="3.5"/>` +
    `<rect x="${x - 4}" y="${y - 11}" width="${w + 8}" height="12" rx="2" fill="${c}" stroke="${INK}" stroke-width="3.5"/>` +
    `<rect x="${x + w / 2 - 5}" y="${y - 11}" width="10" height="${h + 11}" fill="${GOLD}" stroke="${INK}" stroke-width="2.5"/>` +
    `<ellipse cx="${x + w / 2 - 9}" cy="${y - 17}" rx="10" ry="6.5" transform="rotate(-25 ${x + w / 2 - 9} ${y - 17})" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>` +
    `<ellipse cx="${x + w / 2 + 9}" cy="${y - 17}" rx="10" ry="6.5" transform="rotate(25 ${x + w / 2 + 9} ${y - 17})" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>` +
    `<circle cx="${x + w / 2}" cy="${y - 13}" r="4.5" fill="${GOLD}" stroke="${INK}" stroke-width="2.5"/>`;
}
function trumpet(x, y, rot, s = 1) {
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">` +
    `<path d="M-28 -3.5 L5 -3.5 L24 -16 L24 16 L5 3.5 L-28 3.5 Z" fill="${GOLD}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>` +
    `<ellipse cx="24" cy="0" rx="4.5" ry="16" fill="#FFE9A0" stroke="${INK}" stroke-width="3"/>` +
    `<rect x="-33" y="-5.5" width="7" height="11" rx="2" fill="${GOLD}" stroke="${INK}" stroke-width="3"/>` +
    `<rect x="-14" y="-11" width="5" height="8" fill="${GOLD}" stroke="${INK}" stroke-width="2.2"/><rect x="-5" y="-11" width="5" height="8" fill="${GOLD}" stroke="${INK}" stroke-width="2.2"/></g>`;
}
function shield(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})">` +
    `<path d="M0 -26 L22 -18 L20 4 Q15 19 0 28 Q-15 19 -20 4 L-22 -18 Z" fill="#78B2F2" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>` +

// ---------------------------------------------------------------- the plate

function plate(kind, body) {
  const id = ++UID, [a, b] = PLATES[kind];
  let chk = '';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if ((i + j) % 2) chk += `<rect x="${6 + i * 14.5}" y="${6 + j * 14.5}" width="14.5" height="14.5"/>`;
  return `<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>` +
    `<radialGradient id="h${id}" cx="0.28" cy="0.16" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>` +
    `<clipPath id="c${id}"><rect x="6" y="6" width="116" height="116" rx="20"/></clipPath></defs>` +
    `<rect x="6" y="9" width="116" height="116" rx="20" fill="#000" opacity=".35"/>` +
    `<g clip-path="url(#c${id})"><rect width="128" height="128" fill="url(#g${id})"/><g fill="#fff" opacity=".06">${chk}</g>` +
    `<rect width="128" height="128" fill="url(#h${id})"/>${body}</g>` +
    `<rect x="6" y="6" width="116" height="116" rx="20" fill="none" stroke="${INK}" stroke-width="4"/>`;
}
